{id:"m24",lvl:5,title:"Métricas y valor de marca",time:"60 min",
goal:"Vas a medir la salud de una marca y a demostrar el valor de tu trabajo con indicadores claros.",
topics:[
["Brand equity: el valor de la marca",`El **brand equity** es el valor añadido que una marca da a un producto. Dos modelos clásicos:

- **David Aaker**: lealtad, conocimiento de marca, calidad percibida, asociaciones y otros activos propios.
- **Kevin Keller (CBBE)**: una pirámide con **identidad** (¿quién sos?), **significado** (¿qué sos?), **respuestas** (¿qué pienso de vos?) y **relación o resonancia** (¿qué vínculo tenemos?).

Ambos muestran que el valor se construye con recorridos: primero ser conocido, luego relevante y finalmente querido.`,["Reconocimiento primero, cariño después.","El valor de la marca es intangible, pero se puede aproximar."]],
["Indicadores (KPIs) de marca",`- **Conocimiento**: espontáneo (mencionan la marca sin ayuda) y asistido (la reconocen si se las mostrás).
- **Consideración** y **preferencia**.
- **NPS (Net Promoter Score)**: porcentaje de promotores menos porcentaje de detractores, a partir de la pregunta “¿qué tan probable es que nos recomiendes?” de 0 a 10.
- **CSAT**: satisfacción.
- **Share of voice**: porcentaje de conversación de la categoría que ocupa tu marca.
- **Sentimiento** en redes y reseñas.
- **Búsquedas de marca** y **tráfico directo**.
- **Retención y recompra**.`,["Elegí pocos indicadores que respondan a tus objetivos.","Sin línea de base no se puede demostrar mejora."]],
["Métodos de medición",`- **Encuestas de marca** y **tracking** periódico.
- **Brand lift**: mide el efecto de una campaña sobre conocimiento y preferencia.
- **Social listening**: analiza menciones y tono.
- **Focus groups y entrevistas**: profundizan en el porqué.
- **Pruebas A/B** de elementos visuales o mensajes.
- **Prueba de los 5 segundos**, mapas de calor y card sorting.
- **Análisis de reseñas**.

Combiná métodos cuantitativos (cuánto) y cualitativos (por qué).`,["Los números dicen cuánto; las conversaciones dicen por qué.","Las pruebas rápidas pueden hacerse sin grandes presupuestos."]],
["Valoración y tablero de decisión",`Existen rankings que estiman el valor financiero de las marcas (por ejemplo, los de Interbrand, Kantar BrandZ o Brand Finance) con metodologías propias; sirven de referencia, no de verdad absoluta.

Armá un **tablero** con 5 a 7 indicadores: definí el **valor inicial**, la **meta**, la **frecuencia** de medición y **quién actúa** cuando el número se desvía. Los datos son para tomar decisiones, no para decorar informes.`,["Un indicador sin dueño no cambia nada.","Compará contra tu propia línea de base."]]
],

{id:"m25",lvl:5,title:"Legal, ética y sostenibilidad",time:"65 min",
goal:"Vas a proteger tu trabajo y el de tus clientes, y a diseñar con responsabilidad social y ambiental.",
topics:[
["Propiedad intelectual: marca, autoría y diseño",`Aviso: esto es información general, no asesoramiento legal. Consultá con un profesional o con un agente de propiedad industrial de tu país.

- **Marca registrada**: protege un signo (nombre, logo, slogan) para identificar productos o servicios. Es **territorial** (vale en el país donde se registra) y se otorga por **clases** (la Clasificación de Niza agrupa productos y servicios en 45 clases).
- **Derecho de autor**: protege la obra creativa (un diseño, una ilustración) desde su creación, con reglas propias en cada país.
- **Diseño industrial**: protege la apariencia de un producto.
- **Dominios**: se registran aparte y no equivalen a una marca.
- **Símbolos**: ™ indica que se usa como marca; ® indica que está registrada.
- **Búsqueda de anterioridades**: antes de proponer un nombre o logo, verificá que no exista uno igual o muy similar en la misma clase. En Argentina, el organismo es el INPI; a nivel internacional existe el Sistema de Madrid de la OMPI.`,["Registrar la marca protege la inversión.","Buscá siempre anterioridades antes de presentar."]],
["Contratos y derechos del diseñador",`- **Contrato o propuesta firmada**: alcance, entregables, plazos, rondas de revisión, costos y forma de pago (habitualmente con anticipo).
- **Cesión de derechos**: aclarar qué derechos se transfieren y cuándo (por ejemplo, al pagar el total). Es habitual reservar el derecho de mostrar el trabajo en tu portfolio.
- **Licencias de terceros**: fuentes, fotos, íconos, mockups y plugins; verificá que cubran el uso comercial y el de tu cliente.
- **Inteligencia artificial generativa**: revisá las condiciones de uso de cada herramienta y la normativa de autoría de tu país; informá al cliente cuando se use.
- **Confidencialidad** cuando corresponda.

Todo por escrito: protege a las dos partes.`,["Un contrato claro previene conflictos.","Verificá licencias de todo lo que uses."]],
["Ética en el diseño y la comunicación",`- **Honestidad**: evitá el **greenwashing** (aparentar ser sustentable sin serlo) y las promesas engañosas.
- **Inclusión y representación**: mostrar diversidad real, evitar estereotipos, escribir con respeto.
- **Apropiación cultural**: no uses símbolos sagrados o culturales ajenos como decoración; investigá y, si corresponde, colaborá con la comunidad.
- **Accesibilidad**: contraste, tamaños legibles, textos alternativos, lenguaje claro.
- **Privacidad y datos**: transparencia en el uso de información.
- **Uso responsable de IA**: sesgos, derechos, transparencia.

Preguntate: ¿a quién beneficia, a quién puede excluir o dañar este diseño?`,["Diseñar también es tomar decisiones éticas.","La accesibilidad es una forma de inclusión."]],
["Sostenibilidad en la práctica",`- **Materiales y producción**: papeles certificados, tintas al agua, menos capas, tiradas justas y locales.
- **Packaging**: reducir, reutilizar y reciclar; evitar materiales mixtos difíciles de separar.
- **Digital**: imágenes y videos livianos, menos animaciones pesadas, hosting eficiente.
- **Longevidad**: un diseño atemporal se descarta menos.
- **Comunicación**: comprobá con datos lo que afirmás y evitá términos vagos como “eco” sin respaldo.

La sostenibilidad es un criterio de diseño, no un adorno.`,["Menos y mejor suele ser más sostenible.","Toda afirmación ambiental debe poder demostrarse."]]
],

{id:"m26",lvl:6,title:"Gestión de proyectos y cotización",time:"75 min",
goal:"Vas a planificar un proyecto de identidad de punta a punta, calcular su precio y manejar al cliente con profesionalismo.",
topics:[
["Fases y cronograma de un proyecto",`Un proyecto de identidad completo suele durar de **6 a 10 semanas** (varía según el alcance):

1. **Descubrimiento** (1 a 2 semanas): brief, investigación, entrevistas.
2. **Estrategia** (1 a 2): plataforma, personalidad, posicionamiento, naming si aplica.
3. **Concepto** (1 a 2): ideas, moodboards, presentación de direcciones.
4. **Desarrollo** (2 a 3): logo, sistema y refinamiento tras feedback.
5. **Aplicaciones y manual** (1 a 2).
6. **Entrega y lanzamiento** (1).

Definí **hitos con aprobación** por escrito: sin aprobación, no se avanza. Dejá margen para imprevistos.`,["Cada fase termina con una aprobación del cliente.","Un cronograma claro evita expectativas irreales."]],
["Cómo calcular tu precio",`Modelos de cobro:
- **Por hora**: simple, pero castiga a quien trabaja rápido y desalienta el valor.
- **Por proyecto**: precio cerrado con alcance definido. El más común en identidad.
- **Por valor**: según el impacto para el cliente (más complejo).
- **Por paquetes o abono mensual (retainer)**: servicios recurrentes.

Pasos para cotizar:
1. Estimá **horas por fase**.
2. Multiplicá por tu **tarifa por hora** (calculada a partir de tus gastos, ingresos deseados y horas facturables reales).
3. Sumá **costos directos** (licencias, impresiones, mockups, terceros).
4. Agregá un **margen** para imprevistos y revisiones extra.
5. Sumá los impuestos que correspondan en tu jurisdicción.

Usá la calculadora de más abajo con tus números.`,["No cobres sólo por tiempo: cobrá también por experiencia y valor.","Incluí siempre un margen para imprevistos."]],
["Gestión del cliente y del feedback",`- **Onboarding**: reunión inicial, brief, contrato y anticipo.
- **Comunicación**: un canal principal, resumen por escrito de cada reunión y fechas de entrega.
- **Feedback**: pedí comentarios sobre **problemas** (“no me transmite calidez”) y no soluciones (“ponelo en rojo”). Reunilos en una sola devolución del cliente.
- **Rondas de revisión**: pactadas (por ejemplo, 2 o 3 incluidas). Cambios de dirección o adicionales se cotizan aparte.
- **Scope creep** (crecimiento del alcance): registralo y ofrecé una ampliación.
- **Objeciones**: escuchá, reformulá y volvé a la estrategia.
- **Clientes difíciles**: límites claros, tono cordial y decisiones documentadas.`,["El feedback se trabaja: ayudalo a decir el problema.","Lo que no está en el alcance se cotiza aparte."]],
["Cierre y hand-off",`- **Entrega organizada** (archivos, manual, licencias, contraseñas).
- **Reunión de traspaso** para explicar cómo usar el sistema.
- **Período de soporte** breve para dudas.
- **Pedido de testimonio** y permiso para mostrar el caso.
- **Retrospectiva**: qué salió bien, qué mejorar.
- **Plan de seguimiento**: propuesta de auditoría o mantenimiento.

Un buen cierre genera recomendaciones y proyectos futuros.`,["Un cierre ordenado es tu mejor carta de presentación.","Pedí el testimonio mientras el cliente está contento."]]
],

{id:"m27",lvl:6,title:"Presentación, portfolio y marca personal",time:"65 min",
goal:"Vas a presentar tus proyectos con impacto y a construir un portfolio que consiga clientes.",
topics:[
["Presentar una identidad",`Una presentación no muestra archivos: **cuenta una historia** que justifica decisiones.

Estructura:
1. **Contexto y problema** del cliente.
2. **Estrategia** (insight, posicionamiento, personalidad).
3. **Idea rectora**.
4. **Solución visual**: logo, sistema, aplicaciones.
5. **Por qué funciona** (vinculado a la estrategia).
6. **Próximos pasos**.

Consejos: presentá una a tres rutas claras; recomendá una; explicá cómo cada decisión responde al brief; dejá que el cliente vea el logo en contexto (mockups); anticipá dudas; escuchá antes de defender.`,["Explicá el porqué antes que el qué.","Recomendá una ruta con convicción."]],
["Mockups y contexto",`Los mockups muestran el diseño en uso: fachada, tarjeta, packaging, celular, uniforme. Buenas prácticas:

- Elegí escenas **coherentes con el rubro y el público**.
- Cuidá luz, perspectiva y escala.
- Evitá recargar: 5 a 8 mockups bien elegidos valen más que 30.
- Respetá la **licencia** del mockup.
- Alterná mockups realistas con láminas de sistema (paleta, tipografía, patrones).
- Nunca uses un mockup para tapar un logo débil.`,["Un buen mockup muestra la idea, no la esconde.","Menos cantidad, más criterio."]],
["Portfolio y casos de estudio",`- **Seleccioná** 3 a 5 proyectos que representen el trabajo que querés recibir.
- **Estructura de un caso**: contexto, desafío, proceso, solución, resultados (números o testimonios) y aprendizajes.
- **Mostrá el proceso**: bocetos, exploraciones, decisiones.
- **Plataformas**: Behance, sitio propio, PDF, Instagram; lo ideal es un sitio propio con dominio.
- **Proyectos propios o de práctica** cuentan si están bien documentados (este curso te deja uno).
- **Actualizá** con regularidad y quitá lo débil.`,["Un portfolio vende el tipo de trabajo que querés hacer.","El proceso y los resultados convencen más que las imágenes solas."]],
["Marca personal del diseñador",`Vos también sos una marca:

- **Posicionamiento**: ¿para quién sos ideal? (un nicho ayuda: gastronomía, salud, turismo, pymes).
- **Propuesta de valor** en una frase.
- **Presencia**: sitio, redes, contenido útil (procesos, consejos, casos).
- **Testimonios y recomendaciones**.
- **Red de contactos**: colegas, imprentas, fotógrafos, desarrolladores.
- **Formación continua**: tendencias, herramientas, negocios.
- **Precios** acordes a tu posicionamiento.`,["Un nicho claro atrae mejores clientes.","Lo que mostrás es lo que te van a contratar para hacer."]]
],

{id:"m28",lvl:6,title:"Proyecto final integrador",time:"6 a 10 horas",
goal:"Vas a aplicar todo lo aprendido en un proyecto completo de identidad visual y branding, de la estrategia a la presentación.",
topics:[
["El desafío",`Elegí **una marca** para trabajar:
- Un **cliente real** (emprendimiento cercano) o una **marca propia**.
- Una **marca ficticia** con un contexto realista.

Requisitos: que tengas acceso a información (para entrevistas y pruebas) y que el tamaño sea manejable (un negocio local, un estudio, un producto).

Recorrerás las tres fases del curso: **estrategia**, **identidad** y **presentación**.`,["Elegí un proyecto que te entusiasme y que puedas terminar.","Un proyecto con datos reales es mucho más valioso para tu portfolio."]],
["Entregables mínimos",`**Fase 1: estrategia**
- Brief e investigación (competencia y público).
- Plataforma de marca (propósito, valores, posicionamiento, personalidad, esencia).
- Naming, tagline y guía de voz (si aplica).
- Brief creativo y concepto.

**Fase 2: identidad**
- Bocetos (mínimo 50) y proceso.
- Logo con todas sus versiones y pruebas de reducción.
- Paleta y sistema tipográfico.
- Elementos gráficos de apoyo.

**Fase 3: aplicaciones y presentación**
- Al menos 3 aplicaciones (por ejemplo: tarjeta, kit de redes y packaging o señalética).
- Manual de marca de al menos 12 páginas.
- Presentación de 8 a 12 láminas y caso de estudio.`,["Documentá cada paso: el proceso vale tanto como el resultado.","El manual y la presentación son parte del proyecto, no un extra."]],
["Cronograma sugerido",`Un plan de **4 a 6 semanas** (a tu ritmo):

- **Semana 1**: brief, investigación, público y competencia.
- **Semana 2**: plataforma, personalidad, naming y concepto.
- **Semana 3**: bocetos, logo y pruebas.
- **Semana 4**: sistema (color, tipografía, elementos) y aplicaciones.
- **Semana 5**: manual de marca.
- **Semana 6**: presentación, caso de estudio y feedback final.

Poné fechas en tu agenda y trabajá con hitos: cada semana debería terminar con algo tangible.`,["Trabajá por hitos semanales.","Un proyecto terminado vale más que uno perfecto sin terminar."]],
["Autoevaluación con rúbrica",`Evaluá tu proyecto en estos criterios (del 1 al 4 cada uno):

- **Estrategia**: claridad, diferenciación y justificación.
- **Coherencia**: el diseño responde a la estrategia.
- **Originalidad**: se distingue de la competencia.
- **Ejecución técnica**: construcción, ajustes ópticos, pruebas y archivos.
- **Sistema y aplicaciones**: versatilidad y consistencia.
- **Documentación**: manual y proceso.
- **Presentación**: claridad narrativa y calidad de mockups.
- **Ética y legalidad**: búsquedas, licencias, accesibilidad.

Un resultado de **26 puntos o más sobre 32** indica un proyecto sólido; menos de 20 sugiere volver sobre la estrategia y las pruebas.`,["La autoevaluación honesta te hace mejorar.","Pedí feedback externo antes de dar el proyecto por terminado."]]
],

const GLOS=[
["Arquetipo","Modelo de personalidad basado en patrones universales (como Héroe o Sabio) que se usa para definir el carácter de una marca."],
["Área de seguridad","Espacio libre mínimo alrededor del logo donde no deben aparecer otros elementos."],
["Branding","Proceso de construir y gestionar la percepción de una marca."],
["Brief","Documento o conversación que define el problema, los objetivos y las condiciones de un proyecto."],
["Brand equity","Valor añadido que una marca aporta a un producto o servicio."],
["CMYK","Modo de color sustractivo (cian, magenta, amarillo y negro) usado en impresión."],
["Co-branding","Alianza donde dos marcas se asocian para crear valor conjunto."],
["Contraforma","Espacio interior o entre letras (como el agujero de la “o”)."],
["Dieline (troquel)","Plantilla de corte y plegado de un envase o pieza impresa."],
["Espacio negativo","Espacio vacío alrededor o dentro de las formas; también puede formar imágenes ocultas."],
["Favicon","Ícono pequeño que identifica un sitio en pestañas y marcadores."],
["Gestalt","Teoría psicológica sobre cómo el cerebro agrupa e interpreta formas."],
["Grid (retícula)","Estructura de columnas, filas y márgenes que ordena el contenido."],
["HEX","Código hexadecimal de un color para pantallas (por ejemplo, #2233E0)."],
["Identidad visual","Conjunto de elementos gráficos que expresan una marca: logo, color, tipografía, imágenes y más."],
["Imagotipo","Marca que combina símbolo y texto, que pueden usarse por separado."],
["Insight","Verdad humana no obvia sobre el público que abre una oportunidad."],
["Isologo","Marca donde símbolo y texto forman una unidad inseparable."],
["Isotipo","Símbolo de una marca sin texto."],
["Kerning","Ajuste del espacio entre pares específicos de letras."],
["Leading (interlineado)","Distancia entre líneas de texto."],

/* markdown mínimo: **negrita**, listas con "- " y "1. ", citas con "> " */
function md(t){
 const inl=s=>s.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
 const out=[];let list=null,para=[];
 const fP=()=>{if(para.length){out.push("<p>"+inl(para.join(" "))+"</p>");para=[]}};
 const fL=()=>{if(list){out.push("<"+list.t+">"+list.i.map(x=>"<li>"+inl(x)+"</li>").join("")+"</"+list.t+">");list=null}};
 t.trim().split("\n").forEach(raw=>{
  const l=raw.trim();let m;
  if(!l){fP();fL();return}
  if((m=l.match(/^- (.*)/))){fP();if(!list||list.t!=="ul"){fL();list={t:"ul",i:[]}}list.i.push(m[1]);return}
  if((m=l.match(/^\d+\. (.*)/))){fP();if(!list||list.t!=="ol"){fL();list={t:"ol",i:[]}}list.i.push(m[1]);return}
  if((m=l.match(/^> ?(.*)/))){fP();fL();out.push("<blockquote><p>"+inl(m[1])+"</p></blockquote>");return}
  fL();para.push(l);
 });
 fP();fL();return out.join("");
}

let Q=null;
function mountQuiz(raw,pass,n,box,cb){
 const draw=()=>{
  let list=raw.slice();if(n){list=shuffle(list).slice(0,n)}
  Q={pass,qs:list.map(r=>({q:r[0],e:r[3],o:shuffle(r[1].map((t,i)=>({t,c:i===r[2]})))}))};
  box.innerHTML=Q.qs.map((x,i)=>`<div class="qq"><p class="qt">${i+1}. ${x.q}</p>${x.o.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}"><span>${o.t}</span></label>`).join("")}<div class="fb"></div></div>`).join("")+`<div class="qbar"><button class="btn" id="qchk">Comprobar respuestas</button><div id="qres"></div></div>`;
  $("#qchk",box).onclick=()=>grade(box,cb,draw);
 };
 draw();
}
function grade(box,cb,redo){
 const els=$$(".qq",box);
 if(els.some(e=>!e.querySelector("input:checked"))){$("#qres",box).innerHTML=`<p class="bad" role="alert">Respondé todas las preguntas antes de comprobar.</p>`;return}
 let ok=0;
 els.forEach((e,i)=>{
  const q=Q.qs[i],sel=+e.querySelector("input:checked").value,good=q.o[sel].c;
  if(good)ok++;
  $$(".opt",e).forEach((l,j)=>{l.classList.toggle("ok",q.o[j].c);l.classList.toggle("no",j===sel&&!good);l.querySelector("input").disabled=true});
  e.querySelector(".fb").textContent=(good?"Correcto. ":"Incorrecto. ")+q.e;
 });
 const p=Math.round(ok/els.length*100),pass=p>=Q.pass;
 $(".qbar",box).innerHTML=`<div class="res ${pass?"okb":"nob"}"><b>${ok} de ${els.length} (${p}%).</b> ${pass?"Aprobado.":"Necesitás "+Q.pass+"% para aprobar. Repasá los temas y probá de nuevo."}</div>${pass?"":`<div class="btns"><button class="btn" id="qre">Reintentar</button></div>`}`;
 if(!pass)$("#qre",box).onclick=()=>{redo();box.scrollIntoView({behavior:"smooth",block:"start"})};
 if(pass)cb(p);
}

 <div class="act qz"><ul class="cl" style="margin:0"><li><label><input type="checkbox" disabled ${nDone()===MODS.length?"checked":""}><span>Completar los ${MODS.length} módulos (llevás ${nDone()}).</span></label></li><li><label><input type="checkbox" disabled ${finOk()?"checked":""}><span>Aprobar el examen final con 70% o más.</span></label></li></ul></div>
 <div class="btns"><a class="btn" href="#/final">Ir al examen final</a><button class="btn ghost" id="cpv">Ver vista previa</button></div><div id="pv"></div>`;
}
function afterCert(){
 const g=id=>document.getElementById(id);
 if(g("cpng"))g("cpng").onclick=()=>dl("Certificado - "+S.name+".png","image/png",certPNG(),true);
 if(g("cprint"))g("cprint").onclick=()=>window.print();
 if(g("cname"))g("cname").onclick=()=>{S.name="";S.cert=null;saveNow();boot()};
 if(g("cpv"))g("cpv").onclick=()=>{g("pv").innerHTML=certHTML(true)};
}
function certPNG(){
 const W_=2400,H=1697,cx=W_/2,c=document.createElement("canvas");c.width=W_;c.height=H;
 const x=c.getContext("2d"),cd=certData();
 const SANS='"Helvetica Neue",Helvetica,Arial,sans-serif',SERIF='"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif',SCRIPT='"Snell Roundhand","Brush Script MT","Segoe Script","Lucida Handwriting",cursive';
 x.fillStyle="#fffefb";x.fillRect(0,0,W_,H);
 x.strokeStyle="#0f1220";x.lineWidth=14;x.strokeRect(45,45,W_-90,H-90);
 x.strokeStyle="#2233e0";x.lineWidth=4;x.strokeRect(96,96,W_-192,H-192);
 const T=(t,X,Y,f,col,al)=>{x.font=f;x.fillStyle=col;x.textAlign=al||"center";x.fillText(t,X,Y)};
 try{x.letterSpacing="14px"}catch(e){}
 T("CERTIFICADO DE FINALIZACIÓN",cx+7,330,"700 46px "+SANS,"#2233e0");
 try{x.letterSpacing="0px"}catch(e){}
 T("Se certifica que",cx,520,"italic 400 52px "+SERIF,"#454b5e");
 let fs=170;x.font="italic 700 "+fs+"px "+SERIF;
 while(x.measureText(S.name).width>W_-560&&fs>50){fs-=4;x.font="italic 700 "+fs+"px "+SERIF}
 T(S.name,cx,720,"italic 700 "+fs+"px "+SERIF,"#0f1220");
 x.fillStyle="#0f1220";x.fillRect(cx-700,775,1400,4);
 T("completó y aprobó el curso",cx,900,"italic 400 52px "+SERIF,"#454b5e");
 T("Identidad Visual y Branding",cx,1060,"800 118px "+SERIF,"#0f1220");
 T("De principiante a nivel avanzado: "+LEVELS.length+" niveles, "+MODS.length+" módulos y examen final aprobado",cx,1150,"500 40px "+SANS,"#454b5e");
 const cols=[[600,cd.d,"Fecha de emisión"],[cx,"","Claude, creador y profesor del curso"],[1800,cd.id,"Código del certificado"]];
 cols.forEach(([X,txt,lab],i)=>{
  if(i===1)T("Claude",X,1440,"italic 400 150px "+SCRIPT,"#0f1220");
  else T(txt,X,1440,"600 42px "+SANS,"#0f1220");
  x.fillStyle="#0f1220";x.fillRect(X-280,1462,560,3);
  T(lab,X,1515,"500 34px "+SANS,"#454b5e");
 });
 T("Anthropic",cx,1562,"500 32px "+SANS,"#454b5e");
 return c.toDataURL("image/png");
}

/* ================= EVENTOS GLOBALES ================= */
document.addEventListener("input",e=>{const t=e.target;if(t.matches&&t.matches("textarea[data-k]")){S.notes[t.dataset.k]=t.value;save()}});

/* ================= HERRAMIENTAS INTERACTIVAS ================= */
const W={};
function hydrate(){$$(".widget").forEach(el=>{let c={};try{c=JSON.parse(el.dataset.cfg)}catch(e){}if(W[c.w])W[c.w](el,c)})}
const h2r=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
function rgb2hsl([r,g,b]){r/=255;g/=255;b/=255;const M=Math.max(r,g,b),m=Math.min(r,g,b);let h=0,s=0;const l=(M+m)/2;if(M!==m){const d=M-m;s=l>.5?d/(2-M-m):d/(M+m);h=M===r?(g-b)/d+(g<b?6:0):M===g?(b-r)/d+2:(r-g)/d+4;h*=60}return[h,s*100,l*100]}
function hsl2hex(h,s,l){h=((h%360)+360)%360;s/=100;l/=100;const a=s*Math.min(l,1-l),f=n=>{const k=(n+h/30)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1))};return"#"+[f(0),f(8),f(4)].map(v=>Math.round(v*255).toString(16).padStart(2,"0")).join("")}
const lum=([r,g,b])=>{const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};return .2126*f(r)+.7152*f(g)+.0722*f(b)};
const ratio=(a,b)=>{const x=lum(h2r(a)),y=lum(h2r(b));return(Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
const FONTS=[["Georgia (serif clásica)","Georgia,serif"],["Times New Roman","'Times New Roman',Times,serif"],["Palatino","'Palatino Linotype',Palatino,'Book Antiqua',serif"],["Helvetica o Arial","'Helvetica Neue',Helvetica,Arial,sans-serif"],["Verdana (humanista)","Verdana,Geneva,sans-serif"],["Trebuchet MS","'Trebuchet MS',sans-serif"],["Gill Sans o Calibri","'Gill Sans','Gill Sans MT',Calibri,sans-serif"],["Optima o Candara","Optima,Candara,'Segoe UI',sans-serif"],["Rockwell (slab)","Rockwell,'Roboto Slab','Courier New',serif"],["Impact (display)","Impact,Haettenschweiler,'Arial Narrow Bold',sans-serif"],["Courier New (monoespaciada)","'Courier New',Courier,monospace"],["Sistema (interfaz)","system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"],["Manuscrita","'Segoe Script','Brush Script MT','Snell Roundhand',cursive"]];
const fontOpts=sel=>FONTS.map((f,i)=>`<option value="${i}" ${i==sel?"selected":""}>${f[0]}</option>`).join("");
const opts=(arr,sel)=>arr.map(v=>`<option ${v==sel?"selected":""}>${v}</option>`).join("");

W.harmony=(el,c)=>{
 const st=S.w[c.id]||(S.w[c.id]={c:"#2233e0",s:"comp"});
 const SCH=[["comp","Complementario"],["ana","Análogo"],["tri","Triádico"],["spl","Complementario dividido"],["tet","Tetrádico"],["mono","Monocromático"]];
 el.innerHTML=`<div class="wrow"><label>Color base<input type="color" data-f="c" value="${st.c}"></label><label>Esquema<select data-f="s">${SCH.map(o=>`<option value="${o[0]}" ${o[0]===st.s?"selected":""}>${o[1]}</option>`).join("")}</select></label></div><div class="sw"></div><p class="hint">Tocá un color para copiar su código HEX.</p>`;
 const A={comp:[0,180],ana:[-30,0,30],tri:[0,120,240],spl:[0,150,210],tet:[0,90,180,270]};
 const draw=()=>{
  const [h,s,l]=rgb2hsl(h2r(st.c));
  const cols=st.s==="mono"?[-30,-15,0,15,30].map(d=>hsl2hex(h,s,Math.min(95,Math.max(8,l+d)))):A[st.s].map(a=>hsl2hex(h+a,s,l));
  $(".sw",el).innerHTML=cols.map(x=>`<div data-hex="${x}" style="background:${x};color:${lum(h2r(x))>.4?"#111":"#fff"}">${x.toUpperCase()}</div>`).join("");
 };
 el.addEventListener("input",e=>{const f=e.target.dataset.f;if(f){st[f]=e.target.value;draw();save()}});
 draw();
};
W.contrast=(el,c)=>{
 const st=S.w[c.id]||(S.w[c.id]={f:"#0f1220",b:"#ffffff"});
 el.innerHTML=`<div class="wrow"><label>Color del texto<input type="color" data-f="f" value="${st.f}"></label><label>Color del fondo<input type="color" data-f="b" value="${st.b}"></label></div><div class="tpv cv"></div><div class="cr"></div>`;
 const draw=()=>{
  const r=ratio(st.f,st.b),B=(ok,l)=>`<span class="badge ${ok?"y":"n"}">${l}: ${ok?"cumple":"no cumple"}</span>`;
  $(".cv",el).innerHTML=`<div style="background:${st.b};color:${st.f};padding:18px;border-radius:8px"><b style="font-size:26px;font-family:var(--serif)">Texto grande de ejemplo</b><p style="margin:.4em 0 0">Este es un texto normal de ejemplo para comprobar la lectura.</p></div>`;
  $(".cr",el).innerHTML=`<p style="margin:12px 0 6px"><b>Relación de contraste: ${r.toFixed(2)} a 1</b></p>`+B(r>=4.5,"AA texto normal (4,5)")+B(r>=3,"AA texto grande y componentes (3)")+B(r>=7,"AAA texto normal (7)");
 };
 el.addEventListener("input",e=>{const f=e.target.dataset.f;if(f){st[f]=e.target.value;draw();save()}});
 draw();
};
W.typepair=(el,c)=>{
 const st=S.w[c.id]||(S.w[c.id]={t:"Tu Marca",h:0,b:3,r:1.25,w:700});
 el.innerHTML=`<div class="wrow"><label>Texto del título<input data-f="t" value="${esc(st.t)}"></label></div><div class="wrow"><label>Fuente de títulos<select data-f="h">${fontOpts(st.h)}</select></label><label>Fuente de texto<select data-f="b">${fontOpts(st.b)}</select></label></div><div class="wrow"><label>Escala<select data-f="r">${opts([1.125,1.2,1.25,1.333,1.5,1.618],st.r)}</select></label><label>Peso del título<select data-f="w">${opts([400,600,700,900],st.w)}</select></label></div><div class="tpv"></div>`;
 const draw=()=>{
  const r=+st.r,sz=[3,2,1].map(n=>Math.round(16*Math.pow(r,n))),H=FONTS[st.h][1],B=FONTS[st.b][1],hs=`font-family:${H};font-weight:${st.w};`;
  $(".tpv",el).innerHTML=`<div style="${hs}font-size:${sz[0]}px;line-height:1.1">${esc(st.t)}</div><div style="${hs}font-size:${sz[1]}px;line-height:1.2;margin-top:.5em">Subtítulo de ejemplo</div><div style="${hs}font-size:${sz[2]}px;margin-top:.5em">Destacado</div><p style="font-family:${B};font-size:16px;line-height:1.6;margin:1em 0 .5em">Este es un párrafo de ejemplo para probar cómo conviven las dos fuentes en un texto real. Fijate en el ritmo, el contraste y la legibilidad.</p><small style="color:var(--mu)">Escala ${r}: ${sz.join(", ")} y 16 px.</small>`;
 };
 el.addEventListener("input",e=>{const f=e.target.dataset.f;if(!f)return;st[f]=["h","b","w","r"].includes(f)?+e.target.value:e.target.value;draw();save()});
 draw();
};
W.sizetest=(el,c)=>{
 const st=S.w[c.id]||(S.w[c.id]={t:"Tu Marca",f:0,w:700,a:"#2233e0"});
 el.innerHTML=`<div class="wrow"><label>Nombre de la marca<input data-f="t" value="${esc(st.t)}"></label><label>Fuente<select data-f="f">${fontOpts(st.f)}</select></label></div><div class="wrow"><label>Peso<select data-f="w">${opts([400,600,700,900],st.w)}</select></label><label>Color de acento<input type="color" data-f="a" value="${st.a}"></label></div><div class="stv"></div>`;
 const draw=()=>{
  const b=`font-family:${FONTS[st.f][1]};font-weight:${st.w};line-height:1.15;overflow-wrap:anywhere;`,ini=esc((st.t||"?").trim().charAt(0)||"?");
  $(".stv",el).innerHTML=
  `<div style="background:#fff;color:#0f1220"><small>Positivo en varios tamaños</small>${[54,30,18,12,9].map(s=>`<div style="${b}font-size:${s}px;margin:.15em 0">${esc(st.t)}</div>`).join("")}</div>`+
  `<div style="background:#0f1220;color:#fff"><small>Negativo</small><div style="${b}font-size:40px">${esc(st.t)}</div><div style="${b}font-size:16px;margin-top:8px">${esc(st.t)}</div></div>`+
  `<div style="background:#fff;color:${st.a}"><small>Un solo color</small><div style="${b}font-size:40px">${esc(st.t)}</div></div>`+
  `<div style="background:${st.a};color:#fff"><small>Color sobre fondo de acento</small><div style="${b}font-size:40px">${esc(st.t)}</div></div>`+
  `<div style="background:#f2f2f2;color:#111;filter:grayscale(1)"><small>Escala de grises</small><div style="${b}font-size:40px;color:${st.a}">${esc(st.t)}</div></div>`+
  `<div style="background:#fff;color:#0f1220"><small>Ícono reducido</small><div style="display:flex;gap:12px;align-items:flex-end">${[64,32,16].map(s=>`<div style="width:${s}px;height:${s}px;background:${st.a};color:#fff;display:grid;place-items:center;border-radius:${Math.round(s/6)}px;${b}font-size:${Math.round(s*.6)}px">${ini}</div>`).join("")}</div></div>`;
 };
 el.addEventListener("input",e=>{const f=e.target.dataset.f;if(!f)return;st[f]=["f","w"].includes(f)?+e.target.value:e.target.value;draw();save()});
 draw();
};
W.spectrum=(el,c)=>{
 const v=S.w[c.id]||(S.w[c.id]=c.pairs.map(()=>50));
 el.innerHTML=c.pairs.map((p,i)=>`<div class="sp"><div class="sp-l"><span>${p[0]}</span><span>${p[1]}</span></div><input type="range" min="0" max="100" value="${v[i]}" data-i="${i}" aria-label="${p[0]} o ${p[1]}"></div>`).join("")+`<div class="res"></div>`;
 const sum=()=>{
  const t=c.pairs.map((p,i)=>{const x=v[i];return x===50?null:(x<50?[p[0],100-x]:[p[1],x])}).filter(Boolean).sort((a,b)=>b[1]-a[1]).slice(0,4);
  $(".res",el).innerHTML=t.length?"<b>Tu marca tiende a ser:</b> "+t.map(a=>a[0]+" ("+a[1]+"%)").join(", "):"Mové los deslizadores para definir el carácter de tu marca.";
 };
 el.addEventListener("input",e=>{const i=e.target.dataset.i;if(i!=null){v[+i]=+e.target.value;sum();save()}});
 sum();
};
W.quote=(el,c)=>{
 const P=["Investigación y briefing","Estrategia y plataforma","Naming y concepto","Diseño del logo","Sistema visual y aplicaciones","Manual de marca","Reuniones y revisiones"];
 const q=S.w[c.id]||(S.w[c.id]={h:[6,8,6,16,14,10,8],r:15,k:0,m:20});
 const num=(f,l)=>`<label>${l}<input type="number" min="0" step="any" inputmode="decimal" data-f="${f}" value="${q[f]}"></label>`;
 el.innerHTML=`<div class="wrow">${num("r","Tarifa por hora (tu moneda)")}${num("k","Costos directos (licencias, impresiones)")}${num("m","Margen para imprevistos (%)")}</div><table class="qt2"><thead><tr><th>Fase</th><th>Horas</th><th>Monto</th></tr></thead><tbody>${P.map((p,i)=>`<tr><td>${p}</td><td><input type="number" min="0" step="any" inputmode="decimal" data-i="${i}" value="${q.h[i]}" aria-label="Horas de ${p}"></td><td class="am"></td></tr>`).join("")}</tbody></table><div class="res"></div>`;
 const fm=n=>Math.round(n).toLocaleString("es-AR");
 const calc=()=>{
  const hs=q.h.reduce((a,b)=>a+b,0),sub=hs*q.r,base=sub+q.k,tot=base*(1+q.m/100);
  $$(".am",el).forEach((td,i)=>td.textContent=fm(q.h[i]*q.r));
  $(".res",el).innerHTML=`<b>Horas totales:</b> ${hs}<br><b>Trabajo:</b> ${fm(sub)}<br><b>Costos directos:</b> ${fm(q.k)}<br><b>Margen de imprevistos:</b> ${fm(tot-base)}<br><b>Precio total sugerido:</b> ${fm(tot)}<br><span class="hint">Agregá los impuestos que correspondan en tu jurisdicción. Revisá que tu tarifa cubra tus gastos y tu ingreso deseado.</span>`;
 };
 const n=v=>Math.max(0,parseFloat(v)||0);
 el.addEventListener("input",e=>{const t=e.target;if(t.dataset.i!=null)q.h[+t.dataset.i]=n(t.value);else if(t.dataset.f)q[t.dataset.f]=n(t.value);else return;calc();save()});
 calc();
};
W.mood=(el)=>{
 el.innerHTML=`<label class="btn ghost" style="cursor:pointer">Elegir imágenes<input type="file" accept="image/*" multiple hidden></label><div class="mgrid"></div><div class="sw"></div><p class="hint">Tus imágenes no se suben a ningún lado: quedan en tu dispositivo y se pierden al cerrar la página. Sacá una captura si querés conservarlas.</p>`;
 const imgs=[];
 const pal=()=>{
  const cnt={};
  imgs.forEach(o=>{
   try{const cv=document.createElement("canvas");cv.width=cv.height=48;const x=cv.getContext("2d");x.drawImage(o.img,0,0,48,48);const d=x.getImageData(0,0,48,48).data;
    for(let i=0;i<d.length;i+=4){if(d[i+3]<200)continue;const k=(d[i]>>5)+","+(d[i+1]>>5)+","+(d[i+2]>>5);cnt[k]=(cnt[k]||0)+1}}catch(e){}
  });
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).map(([k])=>k.split(",").map(v=>(+v<<5)+16)),pick=[];
  for(const t of top){if(pick.every(p=>Math.hypot(p[0]-t[0],p[1]-t[1],p[2]-t[2])>70))pick.push(t);if(pick.length>=6)break}
  $(".sw",el).innerHTML=pick.map(p=>{const hx="#"+p.map(v=>Math.min(255,v).toString(16).padStart(2,"0")).join("");return`<div data-hex="${hx}" style="background:${hx};color:${lum(p)>.4?"#111":"#fff"}">${hx.toUpperCase()}</div>`}).join("");
 };
 const draw=()=>{$(".mgrid",el).innerHTML=imgs.map((o,i)=>`<div><img src="${o.u}" alt="Imagen ${i+1} del moodboard"><button data-x="${i}" aria-label="Quitar imagen ${i+1}">×</button></div>`).join("");pal()};
 el.querySelector("input[type=file]").addEventListener("change",e=>{
  Array.from(e.target.files).slice(0,24).forEach(f=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{imgs.push({u,img:im});draw()};im.src=u});
  e.target.value="";
 });
 el.addEventListener("click",e=>{const b=e.target.closest("[data-x]");if(b){imgs.splice(+b.dataset.x,1);draw()}});
};

/* ================= INICIO ================= */
boot();

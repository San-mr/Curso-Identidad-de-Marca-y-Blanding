<script>
const LEVELS=[
{n:"Nivel 0",name:"Primeros pasos",tag:"Principiante",d:"Qué es una marca, cómo se compone y con qué herramientas se trabaja."},
{n:"Nivel 1",name:"Fundamentos del diseño",tag:"Base",d:"Los cimientos visuales: principios, composición, color y tipografía."},
{n:"Nivel 2",name:"Estrategia de marca",tag:"Intermedio",d:"Investigar, definir propósito, personalidad, nombre y voz antes de dibujar."},
{n:"Nivel 3",name:"Diseño de la identidad",tag:"Intermedio",d:"Logo, color, tipografía y elementos gráficos convertidos en sistema."},
{n:"Nivel 4",name:"Aplicaciones y sistemas",tag:"Avanzado",d:"Papelería, packaging, entorno digital y manual de marca."},
{n:"Nivel 5",name:"Estrategia avanzada",tag:"Avanzado",d:"Arquitectura de marca, identidades dinámicas, rebranding, marketing, métricas y ética."},
{n:"Nivel 6",name:"Maestría profesional",tag:"Experto",d:"Gestión de proyectos, cotización, presentación, portfolio y proyecto final."}];
const MODS=[];
MODS.push(
{id:"m01",lvl:0,title:"¿Qué es una marca?",time:"50 min",
goal:"Vas a entender qué es realmente una marca, para qué sirve y por qué el logo es sólo una parte del todo.",
topics:[
["Marca, branding e identidad visual: tres cosas distintas",`Se usan como sinónimos, pero no lo son. Entender la diferencia es lo primero que separa a quien dibuja logos de quien construye marcas.

- **Marca**: la percepción que las personas tienen de una empresa, producto o persona. Vive en la cabeza del público, no en un archivo. Una frase clásica: es lo que dicen de vos cuando no estás en la sala.
- **Branding**: el proceso de construir y gestionar esa percepción (estrategia, identidad, comunicación y experiencia).
- **Identidad visual**: la parte visible y sensorial: logo, colores, tipografías, imágenes, formas, movimiento.
- **Imagen de marca**: lo que el público realmente percibe. La identidad es lo que la marca proyecta; la imagen es lo que se recibe.

El trabajo del diseñador es achicar la distancia entre esas dos últimas.`,["La marca no es el logo: el logo es su firma.","Branding es el proceso; la identidad visual es una de sus herramientas.","La identidad se diseña; la imagen se gana con el tiempo."]],
["Para qué sirve una marca",`Una marca bien construida trabaja para el negocio todos los días:

- **Diferencia**: en un mercado saturado, es lo que te separa de la competencia.
- **Genera confianza**: reduce el riesgo percibido al comprar.
- **Simplifica decisiones**: la gente elige rápido lo que reconoce.
- **Crea valor**: dos productos casi idénticos se venden a precios distintos según su marca.
- **Fideliza**: convierte clientes en comunidad.
- **Alinea al equipo**: da un norte interno sobre cómo actuar y comunicar.

> Pensá en dos remeras lisas, del mismo material y con el mismo corte. Una tiene una marca que admirás y la otra no. La diferencia de precio que estarías dispuesto a pagar es el valor de la marca.`,["Una marca ahorra tiempo de decisión al cliente.","Su valor se puede medir en precio, lealtad y recomendación.","Sirve puertas adentro (cultura) y puertas afuera (mercado)."]],
["Un recorrido por la historia",`- **Antigüedad**: el sello del alfarero, los símbolos de los gremios y la marca a fuego en el ganado (de ahí viene “brand”, quemar) servían para indicar origen y garantizar calidad.
- **Revolución industrial**: la producción en masa vuelve anónimos los productos. Nacen las marcas comerciales y sus registros legales; en 1876 el Reino Unido empieza a registrar marcas y el triángulo rojo de la cerveza Bass suele citarse como una de las primeras.
- **Principios del siglo XX**: Peter Behrens crea para AEG (1907) una identidad corporativa integral: logo, edificios, productos y publicidad con un mismo criterio.
- **Mediados del siglo XX**: Paul Rand y otros maestros consolidan la identidad corporativa moderna (Rand rediseñó IBM en 1956). Los manuales de normas, como el de la NASA de 1975, profesionalizan la coherencia.
- **Era digital**: las marcas viven en pantallas de todos los tamaños, por eso las identidades se vuelven flexibles, responsivas y animadas.`,["Marcar para diferenciar es una idea de miles de años.","La coherencia sistemática (manuales) es un invento del siglo XX.","Hoy la identidad se diseña para pantallas y movimiento."]],
["Tipos de marca y qué las hace fuertes",`Se puede construir marca alrededor de casi cualquier cosa: un **producto**, una **empresa**, un **servicio**, una **persona** (marca personal), un **lugar** (ciudad o país), una **causa** u organización sin fines de lucro, o un **evento**.

Las marcas fuertes comparten cinco rasgos:
- **Claras**: se entiende qué son y qué ofrecen.
- **Distintivas**: no se confunden con otras.
- **Consistentes**: se ven y suenan igual en todos lados.
- **Relevantes**: le importan a su público.
- **Emocionales**: generan algo, no sólo informan.`,["Todo puede ser marca, incluso vos.","Distintiva + consistente es la fórmula base del reconocimiento."]]
],
dig:[
{k:"reflect",id:"a",t:"Tu mapa personal de marcas",d:"Respondé con sinceridad, sin pensar en “la respuesta correcta”. Esto es tu punto de partida.",f:["Elegí una marca que uses todos los días. ¿Qué te hace sentir y por qué la elegís?","Si le sacaras el logo, ¿la reconocerías igual? ¿Por qué otros elementos (color, forma, tono)?","Nombrá una marca que te genere desconfianza o rechazo. ¿Qué la provoca?","Con tus palabras: ¿qué es una marca?"]}
],
phys:{t:"Cacería de marcas",m:"cuaderno o 3 hojas, lápiz, celular para fotos.",s:["Recorré tu casa o tu barrio durante 20 minutos y encontrá 10 marcas distintas (envases, carteles, ropa, apps).","En una hoja hacé una tabla con tres columnas: nombre de la marca, 3 adjetivos que te transmite, y qué elemento visual la vuelve reconocible.","Marcá con un círculo las 2 marcas más fuertes y con una cruz las 2 más débiles. Escribí una frase sobre qué las diferencia.","Sacá una foto de la hoja y guardala: es el comienzo de tu archivo de trabajo."]},
quiz:[
["¿Cuál es la mejor definición de marca?",["El logo y los colores de una empresa","La percepción que las personas tienen de una empresa, producto o persona","El nombre registrado ante un organismo oficial","La publicidad que hace una empresa"],1,"La marca vive en la mente del público; el logo es sólo una de sus expresiones."],
["El branding es…",["Un tipo de logo","El proceso de construir y gestionar la percepción de una marca","Sólo la estrategia de redes sociales","La impresión de papelería"],1,"Es el proceso completo: estrategia, identidad, comunicación y experiencia."],
["¿Qué diferencia hay entre identidad e imagen de marca?",["Ninguna, son sinónimos","La identidad es lo que la marca proyecta y la imagen es lo que el público percibe","La identidad es el precio y la imagen es el logo","La imagen se diseña y la identidad se hereda"],1,"Una se diseña (identidad) y la otra se gana (imagen)."],
["Una marca fuerte es, sobre todo…",["Compleja y con muchos colores","Distintiva y consistente","Igual a la competencia líder","Cambiante según la moda"],1,"Ser distintiva y consistente es lo que genera reconocimiento."]
]},

{id:"m02",lvl:0,title:"Anatomía de una marca y de una identidad visual",time:"55 min",
goal:"Vas a poder desarmar cualquier marca en sus partes y entender cómo se relacionan entre sí.",
topics:[
["Las capas de una marca",`Imaginá la marca como una cebolla con capas, de adentro hacia afuera:

1. **Esencia**: por qué existe (propósito y valores).
2. **Personalidad**: cómo sería si fuera una persona.
3. **Identidad verbal**: nombre, mensajes y tono de voz.
4. **Identidad visual**: cómo se ve y se siente.
5. **Experiencia**: lo que vive la gente al usar el producto o servicio.

Regla de oro: las capas de afuera deben ser coherentes con las de adentro. Un logo hermoso sobre una esencia vacía se cae a la primera crítica.`,["Se diseña de adentro hacia afuera: primero estrategia, después forma.","Sin coherencia entre capas la marca pierde credibilidad."]],
["Los componentes de la identidad visual",`Una identidad completa incluye:
- **Logo** con su sistema de versiones.
- **Paleta de color** (primarios, secundarios, neutros).
- **Tipografías** con su jerarquía.
- **Elementos gráficos**: patrones, formas, íconos, texturas.
- **Fotografía e ilustración**: estilo y reglas.
- **Layouts y grillas**: cómo se organizan las piezas.
- **Motion y sonido**: cómo se mueve y suena (opcional, cada vez más importante).

Los cuatro formatos clásicos de marca gráfica (los nombres varían según el país o la escuela; lo importante es la idea):
- **Logotipo**: sólo tipografía, el nombre escrito con carácter propio.
- **Isotipo**: sólo símbolo, sin texto.
- **Imagotipo**: símbolo y texto que pueden usarse por separado.
- **Isologo**: símbolo y texto fusionados, inseparables.`,["La identidad es un conjunto de piezas que trabajan juntas.","Aprendé los cuatro formatos, pero fijate cómo los llama tu cliente o tu país."]],
["Puntos de contacto (touchpoints)",`Una marca se experimenta en cada lugar donde toca a una persona: la cuenta de Instagram, el packaging, el mail de bienvenida, el local, el uniforme, el tono del vendedor, la factura, la atención de reclamos.

Se agrupan en tres momentos:
- **Antes** de comprar: descubrimiento (redes, publicidad, boca en boca, buscadores).
- **Durante**: compra (web, tienda, atención, pago).
- **Después**: uso, soporte, recompra y recomendación.

Mapear los puntos de contacto te muestra dónde la marca ya es fuerte y dónde se rompe.`,["La marca no vive sólo donde vos la diseñás.","Los puntos de contacto “aburridos” (facturas, mails) también comunican."]],
["Coherencia: la identidad es un sistema",`El cerebro reconoce lo que ve repetido de la misma manera. Por eso una identidad no es un logo suelto sino un **sistema de reglas** que se repiten: mismos colores, misma tipografía, mismo estilo de imágenes, misma voz.

Errores típicos de quienes recién empiezan:
- Creer que marca es igual a logo.
- Usar cinco tipografías y siete colores “porque quedan lindos”.
- Copiar tendencias sin preguntarse si le sirven al cliente.
- Diseñar sin haber entendido el negocio.
- No pensar dónde se va a usar (pantalla chica, sello, bordado, cartel).`,["Un sistema simple y bien aplicado vence a uno complejo mal usado.","Preguntá siempre dónde y cómo se va a usar."]]
],

{id:"m03",lvl:0,title:"Herramientas, hábitos y referencias",time:"55 min",
goal:"Vas a armar tu caja de herramientas, entender los formatos de archivo y crear el hábito de investigar antes de diseñar.",
topics:[
["La mentalidad del diseñador",`Diseñar no es decorar: es **resolver un problema de comunicación** con forma, color y palabra. Las cualidades que más se entrenan:

- **Curiosidad**: preguntar por qué antes de proponer.
- **Empatía**: pensar en quién va a ver la marca, no en tu gusto.
- **Iteración**: la primera idea casi nunca es la mejor; hace falta cantidad para encontrar calidad.
- **Apertura a la crítica**: la crítica es sobre el trabajo, no sobre vos. Preguntá “¿qué problema te genera?” en lugar de “¿te gusta?”.
- **Constancia**: un cuaderno de bocetos y práctica frecuente valen más que un curso caro.`,["El diseño resuelve problemas, no sólo embellece.","Aprender a recibir y pedir feedback es una habilidad profesional."]],
["Tu caja de herramientas",`**Analógicas** (nunca las abandones): cuaderno de bocetos, lápices y portaminas, fibras finas, marcadores, regla, escuadra, compás, papel cuadriculado y papel vegetal.

**Digitales** según la tarea:
- Vectoriales (logos e íconos): Adobe Illustrator, Affinity Designer, Inkscape (gratis), Figma.
- Imagen (fotos y texturas): Photoshop, Affinity Photo, GIMP, Krita.
- Maquetación (manuales, catálogos): InDesign, Affinity Publisher, Scribus.
- Interfaces y sistemas de diseño: Figma.
- Colaboración y pizarras: Miro, FigJam, Notion.
- Motion: After Effects, Rive, Lottie.

No importa tanto la herramienta como el criterio. Aprendé a fondo una de cada tipo.`,["Todo empieza en papel; el software es para pulir.","Podés hacer un trabajo profesional con herramientas gratuitas."]],
["Vector vs. píxeles y formatos de archivo",`Una imagen **vectorial** se define con matemática (puntos y curvas): se agranda infinito sin perder calidad. Una imagen **raster** (mapa de bits) está hecha de píxeles: al agrandarla se pixela. Por eso **el logo siempre se construye en vector**.

Formatos que tenés que dominar:
- **SVG, AI, EPS, PDF**: vectoriales (SVG para web; PDF, EPS o AI para imprenta).
- **PNG**: raster con transparencia (web y presentaciones).
- **JPG**: raster comprimido, ideal para fotos, sin transparencia.
- **WebP**: raster moderno y liviano para web.
- **TIFF**: raster de alta calidad para impresión.

Resolución: en pantalla importan los píxeles finales (por ejemplo, 1080 px de ancho para un post); en impresión se trabaja a **300 ppi**. Modo de color: **RGB** para pantalla, **CMYK** para imprenta.`,["Logo = vector. Fotos = raster.","RGB para pantallas, CMYK para imprenta, 300 ppi para papel."]],
["Referencias, moodboards y organización",`Un diseñador se forma mirando mucho y **analizando** lo que ve. Fuentes útiles: Behance, Dribbble, Pinterest, Are.na, Brand New (análisis de identidades), The Dieline (packaging), Awwwards (web), Mobbin (interfaces) y Fonts In Use (tipografía en contexto).

Regla: inspirarse no es copiar. Para cada referencia respondé por escrito **qué me gusta, por qué funciona y cómo lo adaptaría** a mi problema.

Organización básica de un proyecto: una carpeta por cliente con subcarpetas 01_Brief, 02_Investigación, 03_Bocetos, 04_Diseño y 05_Entregas; nombres de archivo con versión y fecha (logo_v03_2026-09-18.ai). Guardá copias de seguridad: el día que pierdas un archivo lo vas a lamentar.`,["Analizar el porqué de una referencia es lo que te forma.","Nombres claros y versiones evitan errores caros."]]
],

{id:"m04",lvl:1,title:"Elementos y principios del diseño",time:"60 min",
goal:"Vas a manejar el vocabulario visual básico y las reglas que ordenan cualquier pieza de diseño.",
topics:[
["Los elementos: la materia prima",`Todo diseño se construye con unos pocos ingredientes:

- **Punto**: la unidad mínima; muchos puntos forman texturas y tramas.
- **Línea**: guía la mirada, separa, conecta y da ritmo (recta, curva, gruesa, fina, punteada).
- **Forma**: geométrica u orgánica. El círculo transmite unidad y suavidad, el cuadrado estabilidad, el triángulo dinamismo o tensión.
- **Color**: matiz, saturación y luminosidad (lo vemos en el módulo 6).
- **Textura**: sensación táctil real o visual.
- **Valor**: qué tan claro u oscuro es algo; crea volumen y contraste.
- **Espacio**: el vacío también diseña. Positivo (lo ocupado) o negativo (el aire alrededor).
- **Tamaño y escala**: define importancia.`,["Cada forma básica comunica algo distinto.","El espacio vacío es un elemento activo, no un resto."]],
["Los principios: cómo se organizan",`- **Equilibrio**: simétrico (formal, estable), asimétrico (dinámico, moderno) o radial.
- **Contraste**: diferencias que generan interés y jerarquía (tamaño, color, peso, forma).
- **Jerarquía**: el orden en que se lee.
- **Énfasis**: un punto focal claro; si todo grita, nada se escucha.
- **Repetición y ritmo**: patrones que crean unidad y movimiento.
- **Proporción**: relación entre los tamaños de las partes.
- **Unidad o armonía**: todo parece pertenecer al mismo mundo.
- **Espacio en blanco (aire)**: descanso que le da valor a lo importante.`,["Un buen diseño tiene un solo protagonista.","Los principios se combinan: contraste + jerarquía + aire."]],
["CARP: cuatro reglas para no equivocarte",`Estas cuatro reglas, popularizadas por Robin Williams en su libro para no diseñadores, mejoran casi cualquier diseño flojo:

- **Contraste**: si dos cosas no son iguales, que sean bien distintas (no “casi” distintas).
- **Alineación**: cada elemento tiene una conexión visual con otro; evitá centrar todo por defecto.
- **Repetición**: repetí colores, formas y estilos para dar coherencia.
- **Proximidad**: lo que está relacionado va junto y lo que no, separado.`,["Contraste, Alineación, Repetición, Proximidad.","Ante la duda, alineá a la izquierda y agrupá."]],
["Jerarquía visual en la práctica",`La jerarquía se construye con seis herramientas: **tamaño, peso, color, posición, espacio y contraste**. Un buen diseño tiene tres niveles claros: lo primero que ves, lo segundo y el detalle.

Dos pruebas para chequearla:
- **Prueba de entrecerrar los ojos**: si al desenfocar la vista todavía distinguís qué es lo primero y qué es lo segundo, funciona.
- **Prueba de los 5 segundos**: mostrale la pieza a alguien 5 segundos y preguntale qué recuerda.`,["Definí qué querés que se lea primero, segundo y tercero.","Probá tus piezas con ojos ajenos."]]
],

{id:"m05",lvl:1,title:"Composición, Gestalt y retículas",time:"60 min",
goal:"Vas a entender cómo percibe el ojo y cómo organizar elementos en un espacio con orden y sentido.",
topics:[
["Las leyes de la Gestalt",`La psicología de la Gestalt estudia cómo el cerebro agrupa lo que ve. Sus leyes se usan todo el tiempo en logos y layouts:

- **Proximidad**: lo cercano se ve como grupo.
- **Semejanza**: lo parecido se agrupa.
- **Cierre**: completamos formas incompletas (el panda del logo de WWF es un buen ejemplo).
- **Continuidad**: el ojo sigue líneas y curvas.
- **Figura-fondo**: distinguimos objeto y fondo; los logos de espacio negativo juegan con esto (la flecha escondida entre la E y la x de FedEx).
- **Simetría y orden**: preferimos las formas equilibradas.
- **Destino común**: lo que se mueve en la misma dirección se percibe unido.
- **Pregnancia**: tendemos a ver la forma más simple posible.`,["El cerebro completa y agrupa: aprovechalo en vez de dibujarlo todo.","Los mejores logos suelen tener una lectura escondida basada en Gestalt."]],
["Composición: dónde poner las cosas",`- **Punto focal**: definí un lugar donde termina la mirada.
- **Regla de tercios**: dividí el espacio en 3×3; los puntos de cruce son posiciones fuertes.
- **Proporción áurea** (1 : 1,618): una relación que aparece en la naturaleza y en muchas composiciones armónicas; útil como guía, no como dogma.
- **Diagonales y líneas guía**: dan movimiento y dirección.
- **Espacio negativo**: dejar aire da elegancia y foco.
- **Patrones de lectura**: en piezas simples el ojo tiende a recorrer una “Z”; en pantallas con mucho texto, una “F”.
- **Simetría vs. asimetría**: la primera transmite orden y tradición; la segunda energía y modernidad.`,["Colocar algo fuera del centro suele generar más interés.","El aire no es desperdicio."]],
["Retículas (grids)",`Una **retícula** es una estructura invisible de columnas, filas y márgenes que ordena el contenido. Sus partes:

- **Márgenes**: el marco libre alrededor.
- **Columnas**: divisiones verticales.
- **Medianiles (gutters)**: espacio entre columnas.
- **Módulos**: las celdas que se forman entre filas y columnas.
- **Líneas base**: guías horizontales para alinear textos.

Tipos: de una columna, de varias columnas, modular y jerárquica. En web se usan mucho las de **12 columnas** (divisible en 2, 3, 4 y 6). Una identidad seria define sus grillas: así cualquiera que arme una pieza mantiene el estilo. Muchos logos también se construyen sobre una grilla geométrica.`,["Una grilla da libertad: decide lo aburrido para que pienses lo importante.","Definí márgenes y medianiles fijos para toda la marca."]],
["Formatos y proporciones",`- Serie **A (ISO 216)**: el A4 mide 21 × 29,7 cm; cada formato es la mitad del anterior manteniendo la proporción (√2).
- En redes: **1:1** (cuadrado), **4:5** (feed vertical), **9:16** (stories, reels y shorts) y **16:9** (video horizontal).
- **Zonas seguras**: dejá libres los bordes donde las apps superponen su interfaz; nunca pongas texto importante ahí.
- Diseñá pensando en el formato final desde el principio: reformatear después es cuesta arriba.`,["Elegí el formato antes de empezar a diseñar.","Zona segura = margen libre para lo importante."]]
],

{id:"m06",lvl:1,title:"Teoría del color",time:"75 min",
goal:"Vas a dominar cómo funciona el color, cómo armar paletas armónicas y cómo comprobar que sean legibles y accesibles.",
topics:[
["Cómo funciona el color",`El color es luz. Se trabaja con dos sistemas:

- **Aditivo (RGB)**: pantallas. Se suma luz roja, verde y azul; todo junto da blanco.
- **Sustractivo (CMYK)**: imprenta. Tintas cian, magenta, amarillo y negro (K) que restan luz; por eso el resultado impreso suele verse más apagado que en pantalla.

Cada color se describe con tres propiedades:
- **Matiz (hue)**: el color en sí (rojo, azul…).
- **Saturación**: intensidad o pureza.
- **Luminosidad (valor)**: cuánta luz tiene, de claro a oscuro.

Derivados: **tinte** (color + blanco), **tono** (color + gris) y **sombra** (color + negro).`,["Pantalla = luz (RGB). Papel = tinta (CMYK).","Matiz, saturación y luminosidad son tus tres perillas."]],
["Armonías cromáticas",`Sobre la rueda cromática, las combinaciones que funcionan siguen fórmulas:

- **Monocromática**: un matiz con variaciones de luz y saturación. Elegante y segura.
- **Análoga**: colores vecinos. Armónica y calma.
- **Complementaria**: opuestos en la rueda. Máximo contraste y energía.
- **Complementaria dividida**: un color y los dos vecinos de su opuesto. Contraste con menos tensión.
- **Triádica**: tres colores equidistantes. Vibrante, requiere equilibrio.
- **Tetrádica**: dos pares complementarios. Rica pero difícil de manejar.

Regla **60-30-10**: 60% color dominante (suele ser neutro), 30% secundario, 10% acento. Probá todas estas fórmulas en la herramienta interactiva de más abajo.`,["Empezá con una fórmula y ajustá a ojo.","Un color de acento funciona porque aparece poco."]],
["Psicología y cultura del color",`Los colores generan asociaciones, pero **no son reglas universales**: dependen de la cultura, la categoría y el contexto.

- **Rojo**: energía, pasión, urgencia, apetito.
- **Naranja**: calidez, entusiasmo, accesibilidad.
- **Amarillo**: optimismo, atención, juventud.
- **Verde**: naturaleza, salud, crecimiento, dinero.
- **Azul**: confianza, calma, tecnología, seriedad.
- **Violeta**: creatividad, espiritualidad, lujo.
- **Negro**: sofisticación, poder, elegancia.
- **Blanco**: limpieza, simplicidad, vacío.

Ejemplo cultural: el blanco simboliza duelo en varias culturas de Asia oriental, mientras que en Occidente se asocia con pureza. Investigá siempre el público y la categoría: si toda tu competencia usa azul, quizás conviene diferenciarse.`,["Las asociaciones son tendencias, no leyes.","Mirá los colores de la competencia antes de elegir los tuyos."]],
["Modelos y códigos de color",`Un mismo color se nombra de distintas formas según el medio:

- **HEX** (#2233E0) y **RGB** (34, 51, 224): pantalla.
- **HSL**: matiz, saturación y luminosidad; cómodo para crear variaciones.
- **CMYK** (porcentajes de cada tinta): impresión en cuatricromía.
- **Pantone (PMS)**: tinta plana con fórmula exacta; ideal para colores de marca que deben ser idénticos en cualquier impresión.

También existen los **perfiles de color**: sRGB es el estándar de la web y Display P3 muestra más colores en pantallas modernas. Un color muy vibrante en RGB puede quedar **fuera de gama** en CMYK: siempre probalo impreso antes de aprobar.`,["Definí cada color de marca en HEX, RGB, CMYK y, si aplica, Pantone.","Ningún color de pantalla se ve igual impreso: pedí prueba."]],
["Contraste y accesibilidad",`La legibilidad del color no es cuestión de gusto: se mide. La norma WCAG define una **relación de contraste** entre texto y fondo:

- **4,5 : 1** mínimo (nivel AA) para texto normal.
- **3 : 1** para texto grande (desde unos 24 px, o 19 px en negrita) y para componentes de interfaz.
- **7 : 1** para el nivel AAA.

Además, cerca de 1 de cada 12 hombres y 1 de cada 200 mujeres tiene alguna dificultad para distinguir ciertos colores (sobre todo rojo y verde). Por eso **nunca dependas sólo del color** para comunicar algo: sumá texto, íconos o patrones.`,["Medí el contraste, no lo adivines.","Diseñá para todas las personas: es mejor diseño y, en muchos casos, requisito legal."]]
],

{id:"m07",lvl:1,title:"Tipografía",time:"75 min",
goal:"Vas a leer, elegir, combinar y ajustar tipografías con criterio profesional.",
topics:[
["Anatomía de la letra",`Aprender el vocabulario te permite analizar y discutir tipografías con precisión:

- **Línea de base**: donde “apoyan” las letras.
- **Altura de x**: altura de la “x” minúscula; a mayor altura de x, más legible en tamaños chicos.
- **Ascendente y descendente**: partes que suben (b, d, l) o bajan (p, q, g) respecto de la altura de x.
- **Remate (serif)**: pequeños remates en los extremos de los trazos.
- **Asta**: trazo principal; también **brazo**, **bucle**, **ojal** y **contraforma** (el espacio interno, como el agujero de la “o”).
- **Cuerpo**: tamaño del bloque en el que se dibuja la letra.`,["Mirar la altura de x explica por qué dos fuentes “del mismo tamaño” se ven distintas.","La contraforma es tan importante como la forma."]],
["Clasificación y personalidad",`- **Serif humanistas u old style** (Garamond, Jenson): calidez, tradición, mucha lectura.
- **Serif transicionales** (Baskerville, Times): equilibrio y neutralidad.
- **Serif didonas o modernas** (Bodoni, Didot): contraste extremo, elegancia editorial y moda.
- **Slab serif o egipcias** (Rockwell, Clarendon): robustez, cercanía, impacto.
- **Sans neogrotescas** (Helvetica, Akzidenz-Grotesk): neutralidad y modernidad.
- **Sans geométricas** (Futura, Avenir): formas puras, optimismo.
- **Sans humanistas** (Gill Sans, Frutiger): legibilidad y calidez.
- **Script o manuscritas**: personalidad y cercanía; malas para textos largos.
- **Display o decorativas**: sólo para títulos y logos.
- **Monoespaciadas** (Courier): sensación técnica, código.`,["Cada familia tiene un “tono de voz”.","Elegí por personalidad y por función, no por moda."]],
["Espaciado, ritmo y legibilidad",`- **Interletraje (tracking)**: espacio general entre letras. Texto en mayúsculas o muy chico necesita más aire.
- **Kerning**: ajuste del espacio entre **pares** específicos (como “AV” o “To”). Fundamental en logos.
- **Interlineado (leading)**: distancia entre líneas. Para texto corrido suele funcionar entre 120% y 150% del tamaño de la letra.
- **Largo de línea**: entre 45 y 75 caracteres es lo más cómodo de leer.
- **Alineación**: izquierda para leer cómodo; centrada sólo en textos cortos; justificada con cuidado (aparecen “ríos” de espacio).
- **Escala tipográfica**: usá una progresión (por ejemplo, multiplicar por 1,25) para definir tamaños coherentes de título, subtítulo y cuerpo.

**Legibilidad** (distinguir letras) y **lecturabilidad** (leer cómodo un bloque de texto) son cosas distintas: ambas se cuidan.`,["El texto corrido pide interlineado generoso y líneas de largo medio.","Ajustá el kerning de tu logo a mano, siempre."]],
["Combinación tipográfica",`Combinar bien es cuestión de **contraste con afinidad**:

- Usá **2 familias** como máximo (y 3 sólo con un motivo claro).
- Combiná una serif con una sans, o una display con una neutra de lectura.
- Evitá fuentes parecidas pero no iguales: se ven como un error.
- Mantené roles fijos: una para títulos y otra para texto.
- Una superfamilia con muchos pesos y anchos también es una gran solución.
- Probá la combinación en tamaños reales, no sólo en grande.`,["Contraste claro o igualdad total; nunca “casi iguales”.","Jerarquía por peso y tamaño antes que por más fuentes."]],
["Licencias y tipografías para marcas",`Las fuentes son software con licencia. Antes de usar una en un proyecto:

- Las fuentes libres (por ejemplo, las de Google Fonts bajo licencia OFL) se pueden usar comercialmente, incluso en logos.
- Las de foundries o Adobe Fonts tienen licencias distintas: **escritorio, web, app, e-book, logo o marca**. Leé qué cubre cada una.
- Si la marca la va a usar el cliente, **él** debe tener la licencia (o entregale una alternativa libre).
- Las **fuentes variables** guardan muchos pesos y anchos en un solo archivo, útil en web.
- Para diferenciarte: personalizá letras del logo (lettering) o encargá una tipografía a medida.

Diferencia: **tipografía** = sistema de letras reutilizable; **lettering** = letras dibujadas para una sola aplicación, como un logo.`,["Licenciar bien evita problemas legales para vos y para tu cliente.","Tipografía = sistema; lettering = dibujo único."]]
],

],

{id:"m08",lvl:2,title:"Investigación y briefing",time:"65 min",
goal:"Vas a aprender a entender un negocio, a su público y a su competencia antes de dibujar una sola línea.",
topics:[
["El proceso de branding a vista de pájaro",`Un proyecto de identidad suele recorrer estas fases:

1. **Descubrimiento**: brief, entrevistas, investigación.
2. **Estrategia**: plataforma de marca, posicionamiento, personalidad.
3. **Concepto**: ideas, moodboards, direcciones creativas.
4. **Diseño**: logo, sistema visual, aplicaciones.
5. **Implementación**: manual, entregables, lanzamiento.
6. **Gestión**: seguimiento y evolución.

Un modelo muy usado para pensar cada fase es el **Doble Diamante**: primero abrís (explorar el problema) y cerrás (definirlo); después abrís (explorar soluciones) y cerrás (elegir y entregar).`,["Sin estrategia, el diseño es opinión.","Abrí para explorar, cerrá para decidir."]],
["El brief y la reunión con el cliente",`El **brief** es el documento (o la conversación) que define el problema. Preguntas clave:

- ¿Qué hace la empresa? ¿Desde cuándo? ¿Por qué existe?
- ¿A quién le vende y a quién quiere vender?
- ¿Qué problema resuelve y qué la hace distinta?
- ¿Quiénes son los competidores que admira y los que le preocupan?
- ¿Cómo quiere que la perciban en tres palabras?
- ¿Dónde se va a usar la marca (local, web, packaging, redes, uniformes)?
- ¿Qué referencias le gustan y cuáles no? ¿Qué colores o ideas están descartados?
- ¿Cuál es el presupuesto, el plazo y quién decide?

Escuchá más de lo que hablás y pedí siempre el problema de negocio detrás del pedido (“quiero un logo nuevo” casi nunca es el problema real).`,["Un buen brief ahorra semanas de idas y vueltas.","Preguntá por el objetivo de negocio, no sólo por el gusto estético."]],
["Investigación de mercado y competencia",`- **Auditoría de marca existente**: qué se usa hoy, qué funciona y qué no.
- **Análisis de competidores**: listá 5 a 8 y compará su promesa, público, precio, tono y **estética** (colores, formas, tipografías).
- **Mapa de posicionamiento**: dos ejes (por ejemplo, económico–premium y tradicional–moderno) para ubicar competidores y encontrar espacios libres.
- **FODA (SWOT)**: fortalezas, oportunidades, debilidades y amenazas.
- **Tendencias**: del rubro y de la cultura visual, con distancia crítica.

Objetivo: encontrar un lugar **distinto y relevante** donde la marca pueda ganar.`,["Ver a la competencia sirve para diferenciarte, no para copiar.","Un mapa perceptual muestra “dónde hay lugar”."]],
["Conocer al público",`- **Segmentación**: demográfica (edad, lugar), psicográfica (valores, estilo de vida) y conductual (hábitos de compra).
- **Buyer persona**: perfil ficticio, basado en datos reales, que representa a un cliente típico (nombre, edad, trabajo, objetivos, frustraciones, canales).
- **Mapa de empatía**: qué piensa, siente, ve, oye, dice y hace.
- **Customer journey**: el recorrido desde que descubre la marca hasta que la recomienda.
- **Jobs To Be Done**: no se compra un taladro, se compra un agujero en la pared; ¿qué “trabajo” contrata el cliente?
- **Métodos**: entrevistas, encuestas, observación, análisis de reseñas y de redes.

Un **insight** es una verdad humana no obvia sobre el público que abre una oportunidad creativa.`,["Los datos reales valen más que las suposiciones.","Un buen insight puede convertirse en concepto de marca."]]
],

],

["¿Para qué sirve un mapa de posicionamiento?",["Para elegir tipografías","Para ubicar competidores en ejes y encontrar espacios libres","Para calcular precios","Para diseñar la papelería"],1,"Muestra dónde hay lugar para diferenciarse."],
["En el modelo del Doble Diamante, la fase de “definir” consiste en…",["Abrir opciones al máximo","Cerrar y sintetizar el problema a resolver","Imprimir","Publicar en redes"],1,"Se explora el problema, se lo define, luego se exploran y se eligen soluciones."],
["Lo más importante que hay que averiguar en un briefing es…",["Qué color prefiere el cliente","El problema de negocio y el objetivo detrás del pedido","Qué programa usás","Cuántas versiones va a pedir"],1,"“Quiero un logo” casi nunca es el problema real."]

{id:"m09",lvl:2,title:"Plataforma de marca: propósito, valores y posicionamiento",time:"70 min",
goal:"Vas a definir la base estratégica que da sentido a todas las decisiones de diseño y comunicación.",
topics:[
["Propósito, misión, visión y valores",`- **Propósito (el porqué)**: la razón de existir más allá de ganar dinero. Simon Sinek lo ordena en su modelo del Círculo Dorado: **por qué**, **cómo** y **qué**.
- **Misión**: qué hace la marca, para quién y cómo, hoy.
- **Visión**: el futuro que quiere ayudar a construir.
- **Valores**: los principios que guían sus decisiones (elegí 3 a 5; que sean accionables, no palabras vacías como “calidad”).

Un buen test: ¿este valor me haría renunciar a algo? Si no cuesta nada, no es un valor, es decoración.`,["El propósito inspira, la misión orienta, la visión proyecta.","Pocos valores, bien definidos y con ejemplos de conducta."]],
["Propuesta de valor y posicionamiento",`La **propuesta de valor** es el beneficio concreto que la marca ofrece y por qué es mejor que las alternativas. El **posicionamiento** es el lugar que ocupa en la mente del público frente a la competencia.

Un enunciado clásico (adaptado de Geoffrey Moore):

> Para [público] que [necesidad o problema], [marca] es [categoría] que [beneficio principal] porque [razón para creer].

Ejemplo de estructura: “Para emprendedores que necesitan vender online sin complicarse, Nube es la plataforma de tiendas más simple porque se configura en 10 minutos.”

Un posicionamiento fuerte es **relevante** (le importa al público), **diferencial** (nadie más lo dice igual) y **creíble** (se puede probar).`,["Posicionar es elegir: no se puede ser el mejor en todo.","Las razones para creer sostienen la promesa."]],
["Promesa, pilares y esencia",`- **Promesa de marca**: lo que el cliente puede esperar siempre. Si no se cumple, se pierde confianza.
- **Pilares o atributos**: 3 a 4 ideas que sostienen la promesa (por ejemplo: cercanía, rigor técnico, rapidez).
- **Razones para creer (RTB)**: pruebas (datos, certificaciones, testimonios, procesos).
- **Esencia**: la idea central de la marca en una frase o una palabra. Todo debería poder conectarse con ella.

Las marcas excelentes tienen una esencia tan clara que cualquier persona del equipo puede decidir “esto sí, esto no” sin preguntar.`,["Una promesa se cumple en cada punto de contacto.","La esencia es tu filtro de decisiones."]],
["Storytelling y manifiesto",`Contar la historia de la marca conecta emocionalmente. Una estructura sencilla:

1. **Origen**: de dónde viene y qué la motivó.
2. **Conflicto**: el problema del mundo que no le gustó.
3. **Transformación**: qué hizo distinto y qué cambió.
4. **Futuro**: hacia dónde va y cómo el cliente participa.

En la mejor historia, **el héroe es el cliente** y la marca es la guía. El **manifiesto** es un texto breve, emocional y en primera persona plural que resume qué cree la marca (100 a 200 palabras): sirve para alinear al equipo y como fuente de tono y mensajes.`,["Que el cliente sea el protagonista de la historia.","Un manifiesto se escribe para ser leído en voz alta."]]
],

{k:"reflect",id:"a",t:"Armá tu plataforma de marca",d:"Podés usar la marca ficticia del módulo anterior o una propia.",f:["Propósito (por qué existe).","Misión (qué hace, para quién, cómo).","Visión (futuro que quiere construir).","3 a 5 valores, cada uno con una conducta concreta.","Enunciado de posicionamiento completo.","Promesa de marca, 3 pilares y una razón para creer de cada uno.","Esencia en una frase."]},

],

{id:"m10",lvl:2,title:"Personalidad y arquetipos de marca",time:"60 min",
goal:"Vas a darle carácter humano a una marca y traducirlo en decisiones concretas de diseño.",
topics:[
["Personalidad de marca",`Las marcas, como las personas, tienen carácter. Jennifer Aaker propuso cinco dimensiones de personalidad de marca:

- **Sinceridad**: cálida, honesta, cercana.
- **Entusiasmo**: audaz, imaginativa, actual.
- **Competencia**: confiable, inteligente, exitosa.
- **Sofisticación**: elegante, exclusiva, encantadora.
- **Rudeza**: resistente, aventurera, fuerte.

Definí la personalidad con 3 a 5 adjetivos y aclará su “sí” y su “no”: “cercana, **pero no** informal en exceso”.`,["Los adjetivos deben ser diferenciales: “profesional” no dice nada.","Definí también lo que la marca NO es."]],
["Los 12 arquetipos",`Basados en la psicología de Carl Jung y adaptados a la marca por Margaret Mark y Carol Pearson, ofrecen un atajo para definir el carácter (ejemplos habituales de la industria):

- **Inocente**: optimismo y simplicidad (Dove).
- **Sabio**: conocimiento y verdad (Google).
- **Explorador**: libertad y descubrimiento (The North Face).
- **Rebelde**: romper reglas (Harley-Davidson).
- **Mago**: transformar la realidad (Disney).
- **Héroe**: coraje y superación (Nike).
- **Amante**: pasión e intimidad (Chanel).
- **Bufón**: humor y disfrute (Old Spice).
- **Persona común**: pertenencia y practicidad (IKEA).
- **Cuidador**: protección y servicio (UNICEF).
- **Gobernante**: control y prestigio (Mercedes-Benz).
- **Creador**: imaginación y autoexpresión (LEGO).

Elegí un arquetipo principal y uno secundario. Son una herramienta, no una jaula.`,["Un arquetipo principal da foco; uno secundario da matiz.","Los arquetipos son atajos para conversar con el cliente."]],
["De la personalidad al diseño",`Cada rasgo tiene traducciones visuales posibles:

- **Formas**: redondeadas = amable y cercano; angulares = técnico, potente; orgánicas = natural y artesanal.
- **Tipografía**: serif clásica = tradición y confianza; sans geométrica = modernidad; manuscrita = cercanía; slab = robustez.
- **Color**: saturados y cálidos = energía; fríos y sobrios = calma y seriedad; neutros con un acento = sofisticación.
- **Composición**: mucho aire = premium y calma; densidad = energía y abundancia.
- **Fotografía**: espontánea y cálida vs. controlada y perfecta.

Siempre justificá una decisión visual con un rasgo de la personalidad, nunca con “me gusta”.`,["Cada decisión visual debe apoyarse en un atributo de la personalidad.","La coherencia entre personalidad y forma se nota."]],
["Espectros y matriz de personalidad",`Una forma práctica de precisar el carácter es ubicarlo en **espectros** entre dos polos: clásica–moderna, cercana–distante, seria–divertida, sobria–expresiva, accesible–exclusiva, artesanal–tecnológica.

También sirve para el **tono de voz** (formal–informal, respetuoso–irreverente, entusiasta–serio). Usá la herramienta de más abajo y compará tu resultado con el de tu cliente: si difieren mucho, conversalo antes de diseñar.`,["Un espectro obliga a decidir.","Compararlo con el cliente evita malentendidos."]]
],

{id:"m11",lvl:2,title:"Naming, mensajes y voz de marca",time:"65 min",
goal:"Vas a crear nombres memorables, definir cómo habla la marca y organizar sus mensajes.",
topics:[
["Naming: cómo se crea un buen nombre",`Tipos de nombres:
- **Descriptivos**: dicen lo que hacen (Banco de Galicia, Mercado Libre).
- **Evocativos o metafóricos**: sugieren una idea (Amazon, Nike, Patagonia).
- **Inventados**: palabras nuevas (Kodak, Spotify).
- **Acrónimos**: siglas (IBM, BMW).
- **De fundador**: apellidos (Ford, Chanel).
- **Compuestos**: dos palabras unidas (Facebook, YouTube).

Criterios de evaluación: **corto**, fácil de pronunciar y deletrear, memorable, con significado apropiado, **disponible** (dominio, usuarios de redes y registro de marca) y sin connotaciones negativas en otros idiomas.

Proceso: brief de naming → lluvia de 100 nombres → filtro por criterios → 5 finalistas → pruebas con público → verificación legal.`,["Un nombre se elige por estrategia, después por gusto.","Verificá disponibilidad antes de enamorarte del nombre."]],
["Tagline, claim y descriptor",`- **Tagline o slogan**: frase corta que sintetiza la promesa o el carácter (“Just do it”).
- **Claim**: afirmación diferencial de una campaña o producto.
- **Descriptor**: explicación concreta de qué hace la marca, especialmente cuando el nombre es abstracto (“Andina — estudio de diseño”).

Buenas prácticas: breve, propio (que no lo pueda decir cualquier competidor), afirmativo, fácil de decir en voz alta y con ritmo. Probá el “test del reemplazo”: si ponés el nombre de un competidor y sigue funcionando, es genérico.`,["El descriptor da claridad; el tagline da emoción.","Si es genérico, no es tuyo."]],
["Voz y tono",`- La **voz** es la personalidad verbal de la marca y se mantiene constante.
- El **tono** es cómo esa voz se adapta al contexto (una promoción, una disculpa, un aviso técnico).

Una guía de voz suele incluir 3 a 4 atributos con el formato “somos X, pero no Y” y ejemplos de “decimos así / no decimos así”. En español, definí decisiones de localización: **voseo o tuteo**, **neutro o regional**, uso de lenguaje inclusivo, emojis, grado de humor y de tecnicismos.

Ejemplo: “Somos directos, **pero no** fríos”. Sí: “Tu pedido ya salió, llega mañana.” No: “Se informa que su orden ha sido despachada.”`,["La voz es constante; el tono se adapta.","Las decisiones lingüísticas (voseo, neutro) son decisiones de marca."]],
["Mensajes clave y microcopy",`- **Jerarquía de mensajes**: un mensaje principal, 3 beneficios de apoyo y las pruebas que los sostienen.
- **Mensajes por audiencia**: clientes, socios, equipo, prensa.
- **Microcopy**: los textos pequeños (botones, errores, avisos, confirmaciones) que revelan la voz de la marca.
- **Glosario de marca**: palabras que usamos y palabras que evitamos.

Regla de oro del texto de marca: claro antes que ingenioso, específico antes que grandilocuente.`,["Un mensaje principal claro vale más que diez mediocres.","El microcopy es la voz de marca en su versión cotidiana."]]
],

{id:"m12",lvl:2,title:"De la estrategia al concepto creativo",time:"55 min",
goal:"Vas a convertir la estrategia en una idea rectora y en direcciones visuales concretas para explorar.",
topics:[
["El brief creativo",`El **brief creativo** sintetiza la estrategia en una página para orientar el diseño. Incluye:

- **Objetivo**: qué debe lograr la identidad.
- **Público** e **insight**.
- **Mensaje principal** y personalidad.
- **Tono** y palabras clave.
- **Mandatorios**: lo que sí o sí tiene que estar o no puede estar.
- **Entregables**, plazos y usos.

Su función es que todo el equipo y el cliente apunten a lo mismo, y que las decisiones de diseño se puedan defender con argumentos.`,["Una página, sin relleno.","Los mandatorios evitan sorpresas."]],
["La idea rectora",`El **concepto** (o big idea) es la idea central que une lo verbal y lo visual: una metáfora, una tensión, un gesto. Técnicas para encontrarlo:

- **Mapas mentales** a partir de la esencia de marca.
- **Crazy 8s**: ocho ideas en ocho minutos, dibujadas en una hoja doblada.
- **SCAMPER**: sustituir, combinar, adaptar, modificar, proponer otros usos, eliminar, reordenar.
- **Palabras al azar** y analogías: “si esta marca fuera un animal, un lugar, un objeto”.
- **Metáforas visuales**: fusionar dos ideas en una imagen.

Un buen concepto se explica en una oración y se ve en cualquier pieza.`,["Cantidad primero, después curá.","Si no lo podés explicar en una frase, todavía no es un concepto."]],
["Moodboards y direcciones de estilo",`Un **moodboard** reúne imágenes, colores, texturas y palabras para comunicar una atmósfera antes de diseñar. Hay que curarlo con un sentido: cada imagen debe responder a un atributo de la marca.

Presentá **2 o 3 direcciones** realmente distintas entre sí (no variantes de la misma). Cada una con nombre, palabras clave, paleta tentativa, tipografías de referencia y ejemplos de aplicación. El cliente elige un rumbo y ahí se profundiza.

Un **anti-moodboard** (lo que la marca NO debe parecer) ayuda mucho a aclarar límites.`,["Un moodboard sin criterio es una colección de imágenes lindas.","Menos direcciones pero bien diferenciadas."]],
["Evaluar y decidir ideas",`Antes de mostrarle algo a un cliente, evaluá cada idea con criterios:

- **Relevancia**: ¿responde a la estrategia?
- **Diferenciación**: ¿se distingue en su categoría?
- **Memorabilidad**: ¿se recuerda con facilidad?
- **Versatilidad**: ¿funciona en todos los usos?
- **Viabilidad**: ¿se puede producir con el presupuesto?

Usá una **matriz de decisión**: puntuá del 1 al 5 cada idea por criterio y sumá. Complementá con pruebas rápidas: 5 segundos, prueba en tamaño chico y opinión de 3 a 5 personas del público objetivo.`,["Decidí con criterios, no con impulsos.","Descartar buenas ideas es parte del trabajo."]]
],

MODS.push(
{id:"m13",lvl:3,title:"El logo: tipos y principios",time:"65 min",
goal:"Vas a reconocer los tipos de logo, los principios de un buen diseño y los errores más comunes.",
topics:[
["Qué es (y qué no es) un logo",`El logo es la **firma visual** de la marca: el elemento más compacto y repetido de la identidad. Su trabajo es **identificar** y **diferenciar**, no explicar todo lo que hace el negocio. Un buen logo no necesita mostrar una lupa si es un buscador ni un diente si es un dentista.

Se apoya en su **significado acumulado**: con el tiempo, la marca (su calidad, su comunicación) le da sentido al símbolo. Por eso un logo funciona sólo si el negocio lo sostiene.`,["El logo identifica, no describe.","Un símbolo sencillo se carga de significado con el uso."]],
["Tipos de logo",`- **Wordmark (logotipo)**: sólo el nombre, con tipografía propia (Google, Coca-Cola).
- **Lettermark (monograma o siglas)**: iniciales (IBM, HP).
- **Pictórico**: dibujo reconocible (Apple, el pájaro de Twitter).
- **Abstracto**: forma no figurativa (Pepsi, Nike).
- **Mascota**: personaje (KFC).
- **Emblema**: texto dentro de un escudo o sello (Harley-Davidson).
- **Combinado**: símbolo más texto (Adidas, Lacoste).
- **Dinámico o adaptable**: cambia según contexto (lo veremos en el nivel 5).

Elegir el tipo depende de la estrategia: nombres largos o desconocidos piden símbolo; nombres cortos y fuertes pueden vivir sólo como wordmark.`,["Los tipos no son excluyentes: se combinan.","El tipo se elige según el nombre, el uso y la estrategia."]],
["Principios de un logo eficaz",`Diseñadores como Paul Rand y autores como Alina Wheeler coinciden en que un logo debe ser:

- **Simple**: se entiende de un vistazo y se dibuja de memoria.
- **Memorable**: tiene un rasgo distintivo.
- **Atemporal**: evita modas pasajeras.
- **Versátil**: funciona grande y chico, en color y en blanco y negro, en positivo y negativo.
- **Apropiado**: encaja con el rubro y el público.
- **Distintivo**: no se confunde con otro.
- **Legible y reproducible** en cualquier técnica (sello, bordado, grabado).

Prueba de fuego: ¿se reconoce en 1 solo color, a 16 px de ancho y en una servilleta?`,["Un buen logo se dibuja de memoria.","Si no funciona en 1 color, todavía no está terminado."]],
["El sistema del logo",`Un logo no es un único archivo sino una **familia de versiones**:

- **Principal**: la versión de referencia.
- **Secundarias**: horizontal, vertical, compacta.
- **Símbolo solo** (para avatares, favicon, íconos de app).
- **Monocromo**: una sola tinta, en positivo y negativo.
- **Versiones para fondos** de color o fotográficos.
- **Responsivo**: se simplifica a medida que baja el tamaño.

Definir cuándo usar cada versión evita improvisaciones y mantiene la coherencia.`,["Diseñá desde el principio todas las versiones.","El símbolo solo debe funcionar como avatar."]],
["Errores frecuentes",`- Demasiados detalles, líneas finas o efectos (sombras, degradados, brillos) que se pierden al achicar.
- Clichés del rubro (globo terráqueo, bombilla, engranaje, mano estrechando otra).
- Copiar o parecerse mucho a otra marca.
- Seguir la moda del momento.
- Usar una tipografía por defecto sin ajustarla ni personalizarla.
- No probar el logo pequeño, en blanco y negro o sobre fondos distintos.
- Falta de ajustes ópticos: kerning y proporciones sin corregir.
- No verificar significados ocultos o accidentales.`,["Sacá efectos: el logo debe sostenerse plano.","Buscá siempre parecidos antes de presentar."]]
],

{id:"m14",lvl:3,title:"Proceso de construcción del logo",time:"80 min",
goal:"Vas a recorrer el camino completo de un logo: desde el primer boceto hasta los archivos finales.",
topics:[
["Boceto: cantidad antes que calidad",`No abras la computadora todavía. El boceto en papel es más rápido, más libre y evita que te enamores del primer resultado.

- Partí de la estrategia: palabras clave, arquetipo y concepto.
- Hacé **50 a 100 bocetos** pequeños (miniaturas de 3×3 cm) sin borrar.
- Explorá combinaciones: sólo texto, sólo símbolo, símbolo + texto, monogramas, espacio negativo.
- Trabajá en **blanco y negro**: si funciona sin color, funcionará con color.
- Elegí 5 y desarrollalos con más detalle; luego 2 o 3 para digitalizar.`,["El papel es tu laboratorio de ideas.","Las mejores ideas suelen aparecer después de las 30 primeras."]],
["Digitalización y construcción vectorial",`Al pasar al vector:

- Usá **la menor cantidad posible de puntos de ancla**: las curvas limpias se construyen con pocos puntos bien ubicados (herramienta Pluma, curvas Bézier).
- Apoyate en **formas geométricas** (círculos, cuadrados, cuadrículas) y en ángulos coherentes (por ejemplo, múltiplos de 15°).
- Mantené **espesores de trazo consistentes** y radios de curvatura relacionados.
- Convertí textos en curvas cuando corresponda y trabajá las letras como formas (no sólo como texto escrito).
- Construí sobre una **grilla** y guardá una versión con las guías visibles (sirve para el manual).`,["Menos puntos, mejores curvas.","La geometría ordena; los ajustes finos la vuelven humana."]],
["Ajustes ópticos",`Lo que es matemáticamente exacto no siempre se ve correcto. Los diseñadores corrigen a ojo:

- **Overshoot**: las formas redondas y puntiagudas (como O o A) deben sobresalir un poco de la línea de base o de mayúsculas para parecer alineadas con las rectas.
- **Kerning manual**: equilibrá el espacio entre letras por “área visual”, no por distancia.
- **Compensación de peso**: los horizontales se ven más gruesos que los verticales del mismo grosor; a veces hay que afinarlos.
- **Centrado óptico**: los símbolos irregulares (como un triángulo) se centran por su masa visual, no por su caja.
- **Simplificación** para tamaños chicos: menos detalles, más espesor.`,["Confiá en el ojo por encima de la regla.","Girá el logo y miralo al revés para detectar desequilibrios."]],
["Pruebas y refinamiento",`Antes de dar por terminado el logo, sometelo a estas pruebas:

- **Reducción**: a 16 px de ancho y a 1 cm impreso.
- **Blanco y negro** y **positivo/negativo**.
- **Fondos** de color, fotográficos y texturados.
- **Mockups**: tarjeta, fachada, packaging, avatar, sello.
- **Prueba de los 5 segundos** y prueba de memoria.
- **Lectura a distancia** y con la vista desenfocada.
- **Búsqueda de parecidos** (búsqueda inversa de imágenes y en registros de marcas).

Anotá qué cambiaste después de cada prueba: así documentás el proceso para presentarlo.`,["Cada prueba mejora el logo.","Documentar el proceso ayuda a defender las decisiones."]],
["Entrega y formatos de archivo",`Un paquete de entrega profesional incluye:

- **Vector**: AI, SVG, EPS y/o PDF.
- **Raster**: PNG con fondo transparente en varios tamaños y JPG para usos básicos.
- **Versiones**: color, monocromo, positivo, negativo, horizontal, vertical y símbolo solo.
- **Perfiles de color**: RGB y CMYK, y Pantone si corresponde.
- Textos **convertidos a curvas** (o entregá las tipografías con sus licencias).
- **Área de seguridad** y **tamaño mínimo** documentados.
- Nombres de archivo ordenados: marca_logo_horizontal_color.svg.

Verificá que los archivos abran en otra computadora y que los PNG tengan realmente fondo transparente.`,["La entrega prolija es parte del servicio.","Probá los archivos como si fueras el cliente."]]
],

{id:"m15",lvl:3,title:"Sistema de color y tipografía de marca",time:"65 min",
goal:"Vas a convertir color y tipografía en un sistema con reglas, códigos y jerarquías listo para usar.",
topics:[
["Construir la paleta de marca",`Una paleta se organiza por roles:

- **Primarios (1 o 2)**: los más representativos; suelen coincidir con el logo.
- **Secundarios o de apoyo (2 a 4)**: enriquecen la paleta y sirven para diferenciar líneas o contenidos.
- **Neutros**: blancos, grises y negros (o tintes cálidos o fríos) para fondos y textos.
- **Funcionales**: éxito, error, alerta, información (sobre todo en digital).

Definí las **proporciones de uso** (por ejemplo, 60-30-10), los **tintes** permitidos y los **pares de texto/fondo** que cumplen accesibilidad. Cada color se documenta en HEX, RGB, CMYK y Pantone si corresponde.`,["Los roles evitan que se usen todos los colores a la vez.","Documentar los pares accesibles ahorra revisiones."]],
["Estrategias de color",`- **Color propio (ownable)**: apropiarse de un color en la categoría lo vuelve reconocible (el azul de Tiffany, el rojo de Coca-Cola).
- **Diferenciación**: si toda la competencia usa azul, un tono distinto puede destacar; pero debe ser coherente con la personalidad.
- **Cultura y contexto**: revisá significados en los mercados donde opere la marca.
- **Modo oscuro**: definí una versión de la paleta para fondos oscuros con la misma jerarquía.
- **Sistemas de color por línea**: en arquitecturas complejas, cada línea puede tener un acento propio dentro de una misma familia.`,["Un color propio es un activo de marca.","No pierdas la jerarquía en modo oscuro."]],
["Jerarquía tipográfica de marca",`Definí un **sistema tipográfico** con roles claros:

- **Fuente institucional o de títulos**: la más expresiva; suele reflejar la personalidad.
- **Fuente de texto**: neutra y legible.
- **Fuente de apoyo o acento** (opcional): citas, datos, destacados.
- **Estilos**: H1, H2, H3, cuerpo, pie, botones, con tamaño, peso, interlineado y tracking.
- **Fuente alternativa segura** (por ejemplo Arial o Georgia) para documentos de Office o correos donde no se puedan instalar las originales.

Especificá también cuándo usar mayúsculas, negritas y cursivas, y el largo de línea en cada soporte.`,["Dos roles claros bastan.","Definí siempre una alternativa para donde no hay fuentes instaladas."]],
["Del sistema a los tokens de diseño",`En digital, las reglas se convierten en **tokens**: nombres que guardan valores reutilizables (color-primario, espaciado-m, radio-borde, tamaño-h1). Ventajas:

- Un cambio en el token se replica en todo el sistema.
- El diseño y el desarrollo hablan el mismo idioma.
- Facilita el modo oscuro y las variantes de marca.

Probá el sistema en **contexto**: armá una pantalla, una pieza impresa y una plantilla de redes con los colores y tipografías definidos; si algo se siente incoherente, ajustá reglas, no piezas.`,["Los tokens conectan diseño y desarrollo.","Probá el sistema en contexto, no sólo en una lámina."]]
],

{id:"m16",lvl:3,title:"Elementos gráficos de apoyo",time:"60 min",
goal:"Vas a ampliar la identidad más allá del logo con patrones, íconos, fotografía e ilustración coherentes.",
topics:[
["Patrones, texturas y grafismos",`Los elementos de apoyo dan riqueza y flexibilidad a la identidad:

- **Patrones**: repeticiones de un módulo derivado del logo, del nombre o de la esencia de marca.
- **Grafismos**: formas, líneas o recortes que actúan como “firma” visual (por ejemplo, un fragmento del símbolo ampliado).
- **Texturas**: aportan carácter táctil (papel, tela, grano, madera).
- **Formas contenedoras**: marcos, globos o recortes reconocibles.

Deben tener una **lógica**: nacer del concepto, no de una biblioteca de recursos.`,["Un patrón bien pensado extiende el logo sin repetirlo.","Todo elemento gráfico debe poder justificarse con la estrategia."]],
["Iconografía y pictogramas",`Un set de íconos consistente comunica orden y calidad. Definí:

- **Estilo**: línea o sólido, esquinas redondeadas o rectas.
- **Grilla**: por ejemplo 24×24 px con márgenes internos.
- **Grosor de trazo**: constante (por ejemplo, 2 px).
- **Nivel de detalle** y metáforas (que se entiendan de inmediato).
- **Color**: monocromo o con un acento.

Los pictogramas (señales) deben ser universales y muy simples; los íconos de marca pueden tener más personalidad.`,["Consistencia de trazo, grilla y esquinas.","Un ícono debe entenderse sin leyenda."]],
["Fotografía e ilustración",`**Fotografía**: definí una dirección de arte con criterios de:
- Sujeto y encuadre (primer plano, ambiente, gente real, producto).
- Luz y color (tratamiento, contraste, saturación).
- Autenticidad (espontánea vs. producida).
- Reglas de uso (fondos, recortes, superposición de texto).

**Ilustración**: elegí un estilo reconocible (plano, lineal, 3D, artesanal, collage) y mantenelo con reglas de paleta y trazo.

**Tratamientos**: duotono, máscaras, gradientes con criterio, filtros de color.

Un banco de imágenes puede servir, pero hacé que las fotos parezcan de la marca (recorte, color, selección coherente). Siempre verificá derechos y licencias.`,["El estilo fotográfico es parte de la identidad.","Revisá siempre las licencias de imágenes."]],
["Layouts, plantillas y visualización de datos",`- **Layouts base**: composiciones repetibles para portadas, presentaciones, posts, folletos.
- **Plantillas editables** (Figma, Canva, PowerPoint) para que el cliente mantenga la coherencia sin ser diseñador.
- **Infografías y gráficos**: usá la paleta de marca con contraste, etiquetas claras y sin decoraciones innecesarias.
- **Reglas de espacio**: márgenes, jerarquía de bloques, uso de imágenes.

Una buena plantilla limita opciones para proteger el estilo, pero deja espacio para variar el contenido.`,["Una plantilla es un manual en acción.","Menos opciones bien pensadas producen más consistencia."]]
],

],

{id:"m17",lvl:4,title:"Aplicaciones impresas y físicas",time:"75 min",
goal:"Vas a llevar la identidad al mundo físico: papelería, packaging, señalética y producción sin sorpresas.",
topics:[
["Papelería institucional",`- **Tarjeta de presentación**: el tamaño más habitual en Argentina es 9 × 5 cm (en Estados Unidos, 3,5 × 2 in; en Europa, alrededor de 8,5 × 5,5 cm). Priorizá nombre, cargo, un medio de contacto principal y la web o red.
- **Hoja membretada** (A4): logo, datos de contacto y espacio generoso para el texto.
- **Sobres, carpetas y sellos**.
- **Facturas, remitos y presupuestos**: también son puntos de contacto.
- **Firma de correo**: breve, con logo liviano y enlaces; sin imágenes gigantes.
- **Presentaciones (PowerPoint o Keynote)**: plantilla maestra con grillas y estilos.

Pensá la papelería como sistema: mismos márgenes, misma jerarquía, mismos colores.`,["Cada pieza de papelería es un punto de contacto.","La hoja y la tarjeta deben parecer de la misma familia."]],
["Packaging y etiquetas",`El envase vende en segundos. Consideraciones:

- **Panel principal**: marca, nombre del producto, variante y un mensaje clave; el resto de la información va en otros paneles.
- **Jerarquía**: qué se ve a un metro, a 30 cm y en la mano.
- **Estructura**: caja, bolsa, doypack, botella, lata, frasco. Cada estructura define **troqueles** o dielines (plantillas de corte y plegado).
- **Materiales y acabados**: cartón, papel kraft, plástico, vidrio; barniz UV, estampado en caliente, relieve.
- **Información obligatoria**: según el rubro existe normativa de rotulado (ingredientes, tabla nutricional, advertencias, códigos). Verificá la reglamentación local antes de diseñar.
- **Sostenibilidad**: menos capas, materiales reciclables, tintas responsables.`,["Diseñá sobre el troquel real, no sobre un rectángulo.","La normativa de rotulado se consulta antes, no después."]],
["Señalética, entorno y merchandising",`- **Señalética y gráfica ambiental**: fachadas, carteles, vidrieras, señales de orientación. Definí visibilidad según la distancia, contraste, iluminación y normativa municipal.
- **Vehículos y uniformes**: la marca en movimiento; pensá curvas, pliegues y visibilidad.
- **Merchandising**: tazas, remeras, bolsas, stickers. Elegí piezas coherentes con la marca (no “cualquier regalito con logo”).
- **Experiencia de espacio**: colores, materiales, olores y música también son marca.

Probá siempre a escala real con maquetas o mockups.`,["Todo objeto con logo debe reforzar la marca.","La escala y la distancia definen el diseño."]],
["Producción e impresión",`Una buena preimpresión evita errores costosos:

- **Modo de color CMYK** y perfil adecuado.
- **300 ppi** en imágenes.
- **Sangrado** de 3 mm y **marcas de corte**.
- **Zona segura** de 3 a 5 mm hacia adentro de los cortes.
- **Textos a curvas** o fuentes incrustadas en PDF.
- **Negro**: para textos pequeños usá K100; para grandes áreas de negro un negro enriquecido según indique la imprenta.
- **Papeles y gramajes**: 300 a 350 g para tarjetas; 90 a 120 g para hojas; según terminación.
- **Técnicas**: offset, digital, serigrafía, sublimación, bordado, grabado láser, DTF.
- **Pruebas de color**: pedí muestra o prueba antes de tirar toda la tirada.

Hablá con la imprenta desde el diseño: ellos conocen máquinas, mínimos y plazos.`,["Sangrado, zona segura y CMYK: el trío básico.","Pedí prueba antes de aprobar la tirada."]]
],

{id:"m18",lvl:4,title:"Identidad digital",time:"75 min",
goal:"Vas a diseñar la presencia de una marca en web, redes, apps y movimiento con criterios de usabilidad y accesibilidad.",
topics:[
["Web y sistemas de diseño",`Una marca en la web se apoya en un **sistema de diseño**: una biblioteca de reglas y componentes reutilizables.

- **Tokens**: colores, tipografías, espaciados y radios.
- **Componentes**: botones, campos, tarjetas, menús, con sus estados (normal, hover, foco, deshabilitado, error).
- **Grillas responsivas**: móvil, tablet y escritorio.
- **Tipografía web**: cuerpo desde 16 px, buen interlineado y pocas fuentes (el rendimiento importa).
- **Accesibilidad**: contraste, foco visible, textos alternativos, navegación por teclado.
- **Modo claro y oscuro**.

La identidad se nota en detalles: esquinas, sombras, microinteracciones, tono de los textos.`,["Diseñar componentes es diseñar la marca en uso.","Rendimiento y accesibilidad son parte del diseño."]],
["Redes sociales",`- **Perfil**: avatar (el símbolo solo, con margen para el recorte circular), portada, nombre, bio y enlaces.
- **Formatos**: 1:1, 4:5, 9:16 y 1,91:1; respetá zonas seguras.
- **Plantillas**: portadas de reels, carruseles y historias con grilla, tipografía y color fijos.
- **Highlights**: íconos coherentes con el sistema.
- **Feed**: pensalo como conjunto; alterná piezas de distinto tipo pero con el mismo hilo visual.
- **Frecuencia y tono**: coherentes con la voz de marca.

Tip: diseñá primero 3 plantillas versátiles antes de producir 30 piezas sueltas.`,["Una plantilla bien diseñada ahorra horas.","El avatar es el logo en su versión más chica."]],
["Activos digitales del logo",`Lista mínima:
- **Favicon**: 16, 32 y 48 px (y SVG).
- **Ícono de app**: 1024 × 1024 px sin bordes redondeados (el sistema los aplica); pensá el contenido dentro de una zona segura.
- **Imagen para compartir (Open Graph)**: 1200 × 630 px.
- **Avatar** cuadrado y circular.
- **Logo horizontal y vertical** para cabeceras y pies.
- **Firma de email** y **cabeceras** de documentos.
- Versiones en **modo claro y oscuro**.

Optimizá el peso de los archivos (SVG limpios, PNG y WebP comprimidos).`,["El favicon es el logo a 16 px: probalo.","Preparate para cada plataforma con sus medidas exactas."]],
["Motion y microinteracciones",`El movimiento le da vida a la marca:

- **Logo animado**: introducciones de 3 a 5 segundos, con una idea clara (por ejemplo, ensamblar o revelar el símbolo).
- **Principios de animación**: aceleración y desaceleración (easing), anticipación, superposición, duración (200 a 500 ms para interacciones de interfaz).
- **Microinteracciones**: botones que responden, cargas, confirmaciones.
- **Formatos**: MP4 (video), GIF (pesado y limitado), Lottie o SVG animado (liviano y escalable), Rive (interactivo).
- **Respeto por el usuario**: ofrecer reducción de movimiento y evitar parpadeos que molesten.

Definí una **guía de movimiento**: velocidades, curvas de easing y ejemplos de uso.`,["El movimiento tiene que tener un motivo.","Definí reglas de motion igual que reglas de color."]]
],

{id:"m19",lvl:4,title:"El manual de marca",time:"70 min",
goal:"Vas a documentar la identidad en un manual claro que cualquiera pueda usar sin arruinarla.",
topics:[
["Para qué sirve y qué tipos hay",`El **manual de marca** (brand book o guía de estilo) documenta las reglas de uso de la identidad. Sirve para:

- Mantener la **coherencia** entre equipos, proveedores y agencias.
- **Acelerar** decisiones: menos consultas, menos errores.
- **Proteger** el valor del trabajo.

Tipos: **manual completo** (estrategia + visual + verbal), **guía rápida** (una o pocas páginas para uso diario), **portal digital** (con descargas, plantillas y actualizaciones) y **kits de prensa**. Un ejemplo histórico es el Manual de Normas Gráficas de la NASA (1975).`,["Un manual que nadie entiende no sirve.","Adaptá el formato al uso real (PDF, web, Figma, Notion)."]],
["Estructura y contenido",`Un índice típico:

1. **Introducción y esencia**: propósito, valores, personalidad y voz.
2. **Logo**: versiones, construcción, **área de seguridad**, **tamaño mínimo**, usos correctos e incorrectos, fondos permitidos.
3. **Color**: paleta con códigos, proporciones y combinaciones accesibles.
4. **Tipografía**: familias, jerarquías y estilos.
5. **Elementos gráficos**: patrones, íconos, grillas.
6. **Fotografía e ilustración**: estilo y ejemplos.
7. **Aplicaciones**: papelería, digital, packaging, señalética.
8. **Voz y tono**: guía verbal y ejemplos.
9. **Recursos y contacto**: descargas, plantillas y a quién consultar.

El **área de seguridad** es el espacio libre mínimo alrededor del logo (suele medirse en una unidad del propio símbolo); el **tamaño mínimo** es el más chico al que se reproduce con legibilidad (por ejemplo, 20 mm impreso o 80 px en pantalla).`,["Mostrá con ejemplos, no sólo con reglas.","Incluí siempre usos incorrectos del logo."]],
["Diseño y redacción del manual",`- **Claridad**: una idea por página, títulos directos, mucho ejemplo visual.
- **Do y Don’t**: mostrá lo correcto y lo incorrecto lado a lado.
- **Consistencia**: el manual mismo debe respetar la marca.
- **Plantillas listas**: entregá archivos editables para las piezas más usadas.
- **Lenguaje simple**: pensá que lo va a leer alguien que no es diseñador.
- **Versión y fecha**: numerá las versiones (v1.0) y guardá un registro de cambios.

Herramientas: InDesign, Affinity Publisher, Figma, Notion o sitios especializados de guías de marca.`,["El manual es un producto para usuarios no expertos.","Sin versión y fecha, nadie sabe cuál es la vigente."]],
["Gobernanza: cuidar la marca en el tiempo",`Definir reglas no alcanza: hay que mantenerlas.

- **Responsable de marca**: una persona o equipo que aprueba usos y resuelve dudas.
- **Proceso de aprobación** para piezas clave.
- **Capacitación**: una reunión breve para explicar el manual al equipo.
- **Auditorías periódicas**: revisar cómo se usa la marca en la realidad.
- **Evolución controlada**: actualizar el manual cuando cambien necesidades, con versiones y comunicación interna.

La marca es un organismo vivo: un manual estático se vuelve obsoleto.`,["Alguien debe ser dueño de la marca.","Actualizá con criterio y comunicalo."]]
],

{id:"m20",lvl:5,title:"Arquitectura de marca y co-branding",time:"60 min",
goal:"Vas a organizar familias de marcas, submarcas y alianzas sin perder claridad ni valor.",
topics:[
["Los modelos de arquitectura",`La **arquitectura de marca** define cómo se relacionan la marca principal, sus productos y sus submarcas.

- **Monolítica (casa de marca única)**: todo bajo un mismo nombre y estilo (Google, FedEx). Máxima eficiencia y fuerza de una sola marca.
- **Casa de marcas**: cada producto tiene su propia marca independiente (Procter & Gamble, Unilever). Permite atender segmentos distintos y aislar riesgos.
- **Marcas respaldadas**: la submarca tiene identidad propia pero con el aval de la marca madre (Courtyard by Marriott).
- **Híbrida**: combina los modelos anteriores según la línea.`,["Elegí el modelo por estrategia, no por costumbre.","Una arquitectura clara evita confusión en el mercado."]],
["Cómo elegir el modelo",`Preguntas para decidir:

- ¿Los públicos son similares o muy distintos?
- ¿La marca madre aporta prestigio a los productos nuevos?
- ¿Un problema en un producto puede dañar a los demás?
- ¿Hay presupuesto para construir varias marcas o conviene concentrar la inversión?
- ¿Existe sinergia entre las líneas (misma tecnología, misma promesa)?
- ¿Cómo se ordenará el crecimiento futuro?

No hay respuesta única. La regla práctica: **cuanta más afinidad, más monolítica; cuanta más diferencia, más independiente**.`,["Concentrar la inversión da fuerza a la marca.","Separar marcas reduce el riesgo reputacional."]],
["Nomenclatura y jerarquía visual",`- **Nomenclatura**: cómo se nombran productos y líneas (descriptivos, códigos o nombres propios).
- **Lockups**: combinaciones oficiales de marca madre + submarca, con proporciones y separaciones definidas.
- **Descriptores**: textos que aclaran qué es cada línea.
- **Sistema de color por línea**: acentos diferentes dentro de una familia coherente.
- **Reglas de prominencia**: qué se muestra primero y con qué tamaño.

Documentá todo en el manual, con ejemplos de combinaciones válidas.`,["Definí el lockup con medidas exactas.","La jerarquía visual debe reflejar la jerarquía estratégica."]],
["Co-branding y alianzas",`El **co-branding** une dos marcas para crear valor mutuo (por ejemplo, una colaboración de producto). El **ingredient branding** destaca un componente dentro de otro producto (un procesador dentro de una notebook).

Reglas para una alianza:
- Afinidad de valores y de público.
- Equilibrio visual (ninguna aplasta a la otra, salvo acuerdo).
- Acuerdos escritos sobre uso, plazos y aprobación.
- Guía de coexistencia de logos (separación, proporciones, fondos).
- Plan de comunicación conjunta.

Cuidá el riesgo: si la aliada tiene una crisis, se ve afectada tu marca.`,["Elegí aliados con valores compatibles.","Escribí las reglas antes de lanzar la colaboración."]]
],

{id:"m21",lvl:5,title:"Identidades dinámicas, motion y sonido",time:"70 min",
goal:"Vas a diseñar identidades flexibles que se adaptan, se animan y suenan, sin perder reconocimiento.",
topics:[
["Identidades flexibles y dinámicas",`En una identidad **dinámica**, el sistema cambia dentro de reglas fijas: una parte permanece (por ejemplo, el nombre o una estructura) y otra varía (color, forma, patrón, imagen).

Ejemplos clásicos: MTV (un logo constante que se rellenaba con imágenes distintas), el MIT Media Lab (un logo generativo con muchas variantes) y la Casa da Música de Oporto (un símbolo con muchas caras y colores).

Ventajas: expresividad, novedad, adaptación a contextos. Riesgos: dilución del reconocimiento, complejidad de gestión. Por eso se necesita un **núcleo fuerte** y reglas de variación claras.`,["Fijá qué nunca cambia y qué puede cambiar.","Más flexibilidad requiere más disciplina."]],
["Sistemas generativos y basados en datos",`Un sistema **generativo** produce variaciones mediante algoritmos o reglas (color, forma, ritmo). Puede alimentarse de **datos** (clima, tráfico, ventas) o de la persona usuaria (un nombre, una foto).

Herramientas: p5.js y Processing, TouchDesigner, Figma (variables y plugins), After Effects (expresiones), y herramientas de IA usadas con criterio.

Consejos:
- Definí reglas por escrito (“las formas nunca se superponen”, “la paleta se limita a 4 colores”).
- Probá muchas variantes y curá las mejores.
- Cuidá la accesibilidad y la coherencia.
- Usá la IA como asistente, no como reemplazo del concepto, y revisá derechos y sesgos.`,["Las reglas son el diseño; las variaciones son el resultado.","Curar sigue siendo trabajo humano."]],
["Motion branding",`Las marcas también se mueven. Elementos del motion branding:

- **Logo animado** (sting) para inicios de video.
- **Transiciones** y animaciones de interfaz.
- **Tipografía cinética**.
- **Ritmo y velocidad**: rápida y precisa, calma y fluida…
- **Guía de motion**: curvas de easing, duraciones, dirección y ejemplos.

Formatos: video (MP4), Lottie, Rive, SVG animado y GIF (con cuidado). Respetá siempre la reducción de movimiento para personas sensibles.`,["El motion expresa personalidad tanto como el color.","Documentá curvas y tiempos igual que tipografías."]],
["Sonido y marca multisensorial",`El sonido también identifica: el **logo sonoro** de Intel, el “ta-dum” de Netflix o el tono clásico de Nokia son ejemplos famosos.

Elementos:
- **Logo sonoro**: 1 a 4 segundos.
- **Paisaje sonoro**: música de fondo en locales, videos y aplicaciones.
- **Voz**: la elección de voces para audios y asistentes.
- **Sonidos de interfaz**: confirmaciones, alertas.

También se pueden diseñar otros sentidos: **tacto** (texturas y materiales), **olfato** (aromas en locales) y **gusto**. Una marca multisensorial suele ser más memorable si los estímulos son coherentes con su esencia.`,["El sonido puede ser tan reconocible como un logo.","Cada sentido debe reforzar la misma esencia."]]
],

{id:"m22",lvl:5,title:"Rebranding y gestión de marca en el tiempo",time:"65 min",
goal:"Vas a decidir cuándo y cómo renovar una marca, y a planificar la transición sin perder capital de marca.",
topics:[
["Cuándo hacer un rebranding",`Motivos válidos:
- **Cambio estratégico**: nuevo público, nueva oferta, reposicionamiento.
- **Fusiones o adquisiciones**.
- **Identidad desactualizada** que no funciona en digital.
- **Problemas de reputación** que exigen un nuevo comienzo (con cambios reales, no sólo cosméticos).
- **Expansión internacional** con problemas de nombre o significado.
- **Simplificación** de una marca compleja.

Motivos débiles: “estamos aburridos del logo”, “lo hizo el sobrino”, “la competencia lo cambió”. Un rediseño **no arregla** un problema de producto o servicio.`,["Cambiá cuando el negocio cambió, no por aburrimiento.","El diseño acompaña la estrategia, no la reemplaza."]],
["Evolución o revolución",`- **Refresh o evolución**: se mantienen los elementos reconocibles y se modernizan (ajustar formas, color, tipografía). Bajo riesgo, aprovecha el capital existente.
- **Rebranding total**: cambia nombre, logo y sistema. Alto impacto y alto riesgo.
- **Reposicionamiento**: cambia la promesa y el público, con ajuste visual acorde.

Antes de decidir, hacé una **auditoría de equity**: qué elementos son reconocidos y queridos (y no conviene perder) y cuáles se pueden abandonar. Consultá a clientes y a empleados.`,["Conservá lo que la gente ya reconoce y valora.","La auditoría de equity reduce riesgos."]],
["Casos para aprender",`- **Gap (2010)**: presentó un logo nuevo y lo retiró en pocos días ante el rechazo del público; lección: consultar y comunicar el cambio.
- **Tropicana (2009)**: rediseño de packaging que perdió elementos icónicos; según lo informado, las ventas cayeron y se volvió al diseño anterior; lección: no eliminar señales de reconocimiento sin pruebas.
- **Instagram (2016)**: pasó de un ícono realista a uno abstracto con degradé; fue muy discutido al principio pero terminó consolidándose; lección: la simplificación puede funcionar si mantiene la idea.

Analizá siempre **qué cambió, por qué y cómo lo comunicaron**, no sólo si te gusta.`,["Los públicos reaccionan cuando sienten que les quitaron algo querido.","Comunicá el cambio con una historia."]],
["Plan de transición y gestión continua",`- **Comunicación interna primero**: el equipo debe entender y defender el cambio.
- **Migración escalonada**: lista de todos los soportes (web, redes, papelería, señalética, vehículos, firmas, facturas) y prioridades.
- **Fecha de lanzamiento** y **relato**: por qué cambia y qué sigue igual.
- **Período de convivencia** de versiones, si corresponde.
- **Medición**: percepción antes y después.

Después del rebranding, la gestión es continua: auditorías periódicas, ajustes menores, capacitación y revisión del manual.`,["Cambiar es fácil; migrar todo es lo difícil.","Medí antes y después."]]
],

{id:"m23",lvl:5,title:"Branding y marketing digital",time:"80 min",
goal:"Vas a conectar la marca con el marketing: contenido, comunidad, canales y experiencia coherentes.",
topics:[
["Branding y marketing: dos tiempos",`- El **branding** construye **demanda futura**: recordación, preferencia y confianza a largo plazo.
- El **marketing de activación o performance** capta **demanda actual**: ventas y conversiones a corto plazo.

Investigaciones de la industria publicitaria (como las de Les Binet y Peter Field) sugieren que los mejores resultados combinan ambos, con un mayor peso de construcción de marca (una referencia habitual es cerca de 60/40, como guía y no como ley).

**Embudo de marca**: conocimiento → consideración → conversión → fidelización → recomendación. Cada etapa tiene mensajes y formatos distintos.`,["Sin marca, la publicidad paga cada venta al precio más alto.","Sin activación, la marca no llega a convertir."]],
["Estrategia de contenidos y storytelling",`- **Pilares de contenido** (3 a 5): temas que reflejan la esencia de la marca (educar, inspirar, mostrar procesos, comunidad, promociones).
- **Calendario editorial**: frecuencia realista, formatos variados, fechas clave.
- **Formatos**: reels, carruseles, historias, videos largos, newsletters, blogs, podcasts, lives.
- **Storytelling**: historias del equipo, del cliente, del producto.
- **Consistencia visual y verbal**: plantillas y guía de voz.
- **Bucle de aprendizaje**: publicar, medir, ajustar.

Regla: primero **valor** (entretener, educar, ayudar) y después venta.`,["Un pilar de contenido responde a una parte de la esencia.","Publicar poco pero bien es mejor que mucho sin criterio."]],
["Comunidad, redes y reputación",`- **Elegí canales** donde esté tu público (no en todos).
- **Comunidad**: respondé, preguntá, agradecé; creá espacios de pertenencia.
- **Contenido generado por usuarios (UGC)** y reseñas: pruebas sociales muy potentes.
- **Creadores y microinfluencers**: elegí por afinidad de valores y audiencia, no sólo por tamaño.
- **Gestión de crisis**: protocolo, voceros, honestidad y rapidez.
- **Reputación online**: reseñas, perfiles en buscadores, menciones. Respondé con la voz de la marca.
- **SEO de marca**: que al buscar tu nombre encuentren información clara y consistente.`,["Una comunidad se cuida todos los días.","La reputación es parte de la identidad."]],
["Experiencia omnicanal y employer branding",`Los clientes cambian de canal sin darse cuenta: ven una publicidad, entran a la web, preguntan por mensaje y compran en el local. La experiencia debe sentirse **una sola marca**.

- **Mapa de experiencia**: recorrido con emociones, puntos débiles y oportunidades.
- **Servicio como marca**: atención, entrega, garantía, devoluciones.
- **Employer branding**: cómo se muestra la marca como lugar de trabajo; el equipo es su mejor embajador.
- **Coherencia prometida–entregada**: no prometas lo que no podés cumplir.`,["La promesa de la publicidad debe cumplirse en la experiencia.","El equipo interno es parte de la marca."]]
],
